<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>크레용 교안 변환 툴</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5a6573;
      --line: #e6e0d6;
      --sand: #f7f1e7;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
      --ok: #2f7d4a;
      --bad: #b42318;
      --shadow: 0 18px 48px rgba(28, 36, 48, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 8% 0%, #ffe7c8 0%, transparent 55%),
        radial-gradient(800px 380px at 100% 0%, #d9eef8 0%, transparent 50%),
        linear-gradient(180deg, #fbf7f0 0%, #f0e6d8 100%);
      padding: 32px 16px 56px;
    }
    .page { max-width: 820px; margin: 0 auto; }
    .hero, .card {
      background: rgba(255,253,249,0.95);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .hero { padding: 28px 30px; margin-bottom: 14px; }
    .eyebrow {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffe8d2;
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -0.03em; }
    .hero p { margin: 0; color: var(--muted); line-height: 1.55; }
    .card { padding: 24px 26px; }
    h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .note { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 14px; }
    input[type="url"] {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #f0a04b);
      color: #fff;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.ghost { background: var(--sand); color: var(--accent-deep); }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--sky);
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      min-height: 1.3em;
      white-space: pre-wrap;
      color: var(--ok);
    }
    .status.err { color: var(--bad); }
    .result {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.55;
    }
    .result.is-on { display: block; }
    .result ul { margin: 8px 0 0; padding-left: 18px; }
    .howto {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: var(--sand);
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }
    .howto ol { margin: 8px 0 0; padding-left: 18px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <span class="eyebrow">EduAllLab · MVP</span>
      <h1>크레용 교안 변환 툴</h1>
      <p>수업 링크를 넣으면 내용을 모아 <strong>좌우로 넘기는 HTML 교안</strong>을 만들어 드립니다. 담당자는 <a href="/desk" style="color:#c45f16;font-weight:800">카드→미리보기 데스크</a>를 쓰세요.</p>
    </header>

    <section class="card">
      <h2>1. 수업 링크 붙여넣기</h2>
      <p class="note">크레용스쿨 레슨 주소만 넣으면 됩니다. (예: 1차시 / 2차시 / 3차시…)</p>

      <label for="url">레슨 URL</label>
      <input id="url" type="url" placeholder="https://crayonschool.co.kr/lessons/..." />

      <div class="samples">
        <button class="chip" type="button" data-url="https://crayonschool.co.kr/lessons/1%ec%b0%a8%ec%8b%9c-%ec%a7%80%ed%98%9c%ed%81%90%eb%b8%8c%eb%a5%bc-%ec%b0%be%ec%95%84%ec%84%9c-ep-1/">지혜큐브 1차시</button>
        <button class="chip" type="button" data-url="https://crayonschool.co.kr/lessons/2%ec%b0%a8%ec%8b%9c-%ea%b0%80-%ea%b1%b0-%ea%b8%b0%eb%a5%bc-%eb%b0%b0%ec%9b%8c%ec%9a%94/">가·거·기 2차시</button>
        <button class="chip" type="button" data-url="https://crayonschool.co.kr/lessons/3%ec%b0%a8%ec%8b%9c-%ea%b3%a0-%ea%b5%ac-%ea%b7%b8%eb%a5%bc-%eb%b0%b0%ec%9b%8c%ec%9a%94/">고·구·그 3차시</button>
      </div>

      <div class="actions">
        <button class="btn" id="btnConvert" type="button">교안 만들기</button>
        <button class="btn ghost" id="btnDownload" type="button" disabled>HTML 다운로드</button>
        <button class="btn ghost" id="btnPreview" type="button" disabled>미리보기</button>
      </div>
      <div class="status" id="status"></div>
      <div class="result" id="result"></div>

      <div class="howto">
        <strong>사용 방법</strong>
        <ol>
          <li><code>포털실행.bat</code>을 더블클릭합니다.</li>
          <li>브라우저가 열리면 링크를 붙여넣고 <b>교안 만들기</b>를 누릅니다.</li>
          <li>끝나면 <b>HTML 다운로드</b>로 저장합니다.</li>
        </ol>
      </div>
    </section>
  </main>

  <script>
    const els = {
      url: document.getElementById("url"),
      btnConvert: document.getElementById("btnConvert"),
      btnDownload: document.getElementById("btnDownload"),
      btnPreview: document.getElementById("btnPreview"),
      status: document.getElementById("status"),
      result: document.getElementById("result"),
    };

    let last = null;

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        els.url.value = btn.dataset.url;
      });
    });

    function setStatus(msg, isErr = false) {
      els.status.textContent = msg;
      els.status.classList.toggle("err", isErr);
    }

    els.btnConvert.addEventListener("click", async () => {
      const url = els.url.value.trim();
      if (!url) {
        setStatus("링크를 입력해 주세요.", true);
        return;
      }

      els.btnConvert.disabled = true;
      els.btnDownload.disabled = true;
      els.btnPreview.disabled = true;
      els.result.classList.remove("is-on");
      setStatus("수집 중… 수업 구성에 따라 20~60초 걸릴 수 있어요.");

      try {
        const res = await fetch("/api/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "변환 실패");

        last = data;
        els.btnDownload.disabled = false;
        els.btnPreview.disabled = false;
        setStatus(`완료: ${data.title} · 스테이지 ${data.stageCount}개`);

        els.result.classList.add("is-on");
        els.result.innerHTML = `
          <strong>${data.title}</strong>
          <div>구성</div>
          <ul>${(data.sections || []).map((s) => `<li>${s}</li>`).join("")}</ul>
          <div style="margin-top:8px">로그</div>
          <ul>${(data.logs || []).map((s) => `<li>${s}</li>`).join("")}</ul>
        `;
      } catch (err) {
        setStatus(String(err.message || err), true);
      } finally {
        els.btnConvert.disabled = false;
      }
    });

    els.btnDownload.addEventListener("click", () => {
      if (!last?.html) return;
      const blob = new Blob([last.html], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = last.filename || "lesson.html";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    els.btnPreview.addEventListener("click", () => {
      if (!last?.html) return;
      const w = window.open("", "_blank");
      w.document.open();
      w.document.write(last.html);
      w.document.close();
    });
  </script>
</body>
</html>
