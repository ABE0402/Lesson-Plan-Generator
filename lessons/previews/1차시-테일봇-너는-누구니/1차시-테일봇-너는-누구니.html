<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1600px, calc(100% - 24px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 48px 24px; /* 좌우 화살표 자리 */
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .align-left { text-align: left; margin-left: 0; margin-right: auto; }
    .align-center { text-align: center; margin-left: auto; margin-right: auto; }
    .align-right { text-align: right; margin-left: auto; margin-right: 0; }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image.size-sm { width: min(42%, 280px); }
    .blk-image.size-md { width: min(72%, 560px); }
    .blk-image.size-lg { width: 100%; }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-image.size-sm img { max-height: min(28dvh, 260px); }
    .blk-image.size-lg img { max-height: min(52dvh, 560px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p.size-sm { width: min(52%, 420px); }
    .blk-h5p.size-md { width: min(78%, 720px); }
    .blk-h5p.size-lg { width: 100%; }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      height: min(32dvh, 360px);
      min-height: 220px;
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-h5p.size-sm iframe { height: min(24dvh, 260px); min-height: 180px; }
    .blk-h5p.size-md iframe { height: min(32dvh, 360px); min-height: 220px; }
    .blk-h5p.size-lg iframe { height: min(42dvh, 480px); min-height: 280px; }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 작은 좌우 화살표 (전체 영역 클릭 아님) */
    .nav-hit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 6;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 2px 10px rgba(60, 40, 20, 0.08);
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      opacity: 0.85;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .nav-hit:hover:not(:disabled) { opacity: 1; background: #fff; }
    .nav-hit.prev { left: 8px; }
    .nav-hit.next { right: 8px; }
    .nav-hit:disabled {
      opacity: 0.28;
      cursor: default;
      box-shadow: none;
    }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 40px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 32px; height: 32px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지">‹</button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지">›</button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">좌우 작은 화살표 또는 키보드 ← → 로 페이지를 넘깁니다.</p>
      </div>
    </div>
  </div>

    let lessonData = {"mode": "blocks", "level": "스토리텔링 코딩로봇 테일봇과 함께하는 코딩 어드벤처", "title": "1차시. 테일봇! 너는 누구니?", "sourceUrl": "https://crayonschool.co.kr/lessons/1%ec%b0%a8%ec%8b%9c-%ed%85%8c%ec%9d%bc%eb%b4%87-%eb%84%88%eb%8a%94-%eb%88%84%ea%b5%ac%eb%8b%88/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["인터랙티브 영상으로 퍼즐미션에 도전한다.", "「2. 연계 활동」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "1차시. 테일봇! 너는 누구니?", "kind": "lesson", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/001_dbcfa2d5_웹-캡처_25-10-2023_173540_smartstore.naver_.com_.jpeg"}, {"type": "text", "text": "[마르시스에듀] 테일봇, 기본맵&OID스티커, 액세서리"}, {"type": "text", "text": "활동지(PDF)"}, {"type": "text", "text": "-활동지는 미리 출력하여 준비해 주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/002_80218160_차시안내_오늘의-활동.jpg"}, {"type": "text", "text": "테일봇이 어떻게 생겼는지 살펴보아요. 테일봇 전원을 켜고 끄는 방법, 각 버튼의 기능과 작동방법을 배워요. 테일봇을 원하는 곳으로 이동시키기 위해 알맞은 버튼을 눌러 코딩해요. 테일봇을 움직여 종이컵 쓰러트리기 활동을 하며 조작의 즐거움을 느껴요."}], "displayName": "01 1차시. 테일봇! 너는 누구니?"}, {"kicker": "1. 영상 학습", "title": "1. 영상 학습", "kind": "topic", "blocks": [{"type": "text", "text": "스토리텔링으로 재미있게 코딩하는 ‘테일봇 코딩 어드벤처’ 수업에 온 걸 환영해요! ‘테일봇’은 로봇에 있는 버튼만 누르면 간단하게 코딩할 수 있기 때문에 코딩이 처음인 친구들도 쉽고 즐겁게 참여할 수 있답니다."}, {"type": "text", "text": "우리는 앞으로 12번의 수업으로 테일봇과 함께 즐거운 코딩 세계로 떠나볼 거예요. 테일봇과 함께 미션을 수행하다보면 어느덧 코딩 왕이 되어 있을 거예요."}, {"type": "text", "text": "그럼 먼저 ‘테일봇’이 어떻게 생겼는지 살펴보도록 해요."}], "displayName": "02 1. 영상 학습"}, {"kicker": "1. 영상 학습", "title": "<함께 약속해요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<함께 약속해요>"}, {"type": "text", "text": "테일봇은 버튼을 눌러 코딩하는 로봇이기 때문에, 소중히 다뤄야 해요. 선생님과 몇 가지 약속해요. 선생님이 설명할 때 테일봇을 혼자 만지거나 조작하지 않기 테일봇을 던지거나 거칠게 다루지 않기 코딩 활동은 꼭 함께 하기"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/003_4607266a_교구활동1_수정.jpg"}], "displayName": "03 <함께 약속해요>"}, {"kicker": "1. 영상 학습", "title": "<테일봇의 첫인상>", "kind": "topic", "blocks": [{"type": "heading", "text": "<테일봇의 첫인상>"}, {"type": "text", "text": "테일봇의 생김새가 어떤가요? 테일봇을 만난 느낌을 자유롭게 이야기해보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/004_42847a72_006-2.png"}, {"type": "text", "text": "테일봇을 준비해주세요. <테일봇의 윗면, 아랫면>"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/005_6ad8c47e_교구활동2_수정.jpg"}, {"type": "text", "text": "윗면 : 사진처럼 9개의 버튼이 있어요. 각 버튼은 테일봇의 움직임이나 기능을 나타내요. 아랫면 : 바퀴가 있어요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/006_b37c6a26_010-1.png"}], "displayName": "04 <테일봇의 첫인상>"}, {"kicker": "1. 영상 학습", "title": "<테일봇의 앞면, 뒷면>", "kind": "topic", "blocks": [{"type": "heading", "text": "<테일봇의 앞면, 뒷면>"}, {"type": "text", "text": "앞면 : 동그란 눈이 한 쌍 있는 쪽이 앞이에요. 뒷면 : 충전 구멍이 뚫려 있고, 그 아래 전원 버튼이 있어요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/007_820b188a_012-2.png"}, {"type": "text", "text": "전원 버튼을 3초 정도 길게 눌렀다 떼 보세요. 소리가 나며 전원이 켜졌나요? 다시 한 번 전원 버튼을 1초 정도 길게 눌렀다 떼 보세요. 소리가 나며 전원이 꺼졌나요?"}, {"type": "text", "text": "테일봇 전원을 켜고 끄는 방법을 배웠으니, 이제 코딩하는 방법도 배워 볼 거예요. 귀여운 테일봇이 어떻게 움직일지 무척 궁금하네요. 그럼, 오늘 수업을 힘차게 시작해볼까요?"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1766", "title": "인터랙티브 #1766"}], "displayName": "05 <테일봇의 앞면, 뒷면>"}, {"kicker": "2. 연계 활동", "title": "2. 연계 활동", "kind": "topic", "blocks": [{"type": "text", "text": "영상 학습을 통해 코딩 맵에서 테일봇을 움직이게 하는 방법을 배웠어요. 앞으로, 뒤로, 오른쪽으로 돌기, 왼쪽으로 돌기 4개의 버튼을 사용해서 맵 위 어디든 이동할 수 있답니다. 오른쪽으로 돌기, 왼쪽으로 돌기 버튼은 테일봇의 몸 방향을 바꿀 뿐 위치를 움직이지 않는다는 점, 꼭 기억하세요."}, {"type": "text", "text": "그럼 테일봇과 함께 즐거운 놀이 활동을 해 볼까요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/008_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "테일봇, 액세서리, 종이컵(10개), 활동지(PDF출력)를 준비해주세요. <종이컵 쓰러트리기 게임 1> 테일봇 양옆의 주황색 부분을 빼낸 다음, 노란색 커넥터 액세서리를 끼워요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/009_1fa4ba45_크기변환놀이활동-01-e1667368387369.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/010_7036bf68_017.png"]}, {"type": "text", "text": "활동지 1의 종이컵 놓는 곳 위에 종이컵을 3단으로 쌓아요. (제일 아래엔 3개, 그 위로 2개, 가장 위에 1개)"}, {"type": "text", "text": "활동지 오른쪽 끝에서부터 테일봇을 움직여 되도록 많은 종이컵을 쓰러트리도록 해요."}, {"type": "text", "text": "· 종이컵이 활동지 밖으로 완전히 나간 것도 쓰러진 것으로 인정합니다. · 종이컵을 손으로 쓰러트리거나 위치를 바꿀 수 없어요. · 테일봇의 출발 위치는 바꿀 수 있지만, 활동지 오른쪽 끝보다 더 가까운 곳에서 시작할 수 없어요."}, {"type": "text", "text": "총 5번 테일봇을 움직여 더 많은 종이컵을 쓰러트린 사람이 승리해요. 코딩할 때마다 어떤 버튼을 눌러 테일봇을 움직였는지 활동지2에 적거나 그리게 해주세요."}], "displayName": "06 2. 연계 활동"}, {"kicker": "2. 연계 활동", "title": "<종이컵 쓰러트리기 게임 2>", "kind": "topic", "blocks": [{"type": "heading", "text": "<종이컵 쓰러트리기 게임 2>"}, {"type": "text", "text": "종이컵으로 아래 그림과 같이 탑을 쌓아요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/011_2221321d_013-1.png"}, {"type": "text", "text": "테일봇을 어떻게 변신시키고 싶나요? 날개, 팔, 커넥터 중 원하는 액세서리를 끼우세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/012_8f7c6176_015.png"}, {"type": "text", "text": "테일봇이 종이컵 탑에 부딪혀 되도록 많은 컵을 쓰러트릴 수 있도록 코딩해 보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/013_c799ceb3_014.png"}], "displayName": "07 <종이컵 쓰러트리기 게임 2>"}, {"kicker": "3. 수업 마무리", "title": "3. 수업 마무리", "kind": "quiz", "blocks": [{"type": "text", "text": "오늘은 테일봇이 어떻게 생겼는지 살펴보고, 전원을 켜고 끄는 방법과 각 버튼에 대해 알아보았어요. 그리고 테일봇을 원하는 곳으로 이동시키기 위해 버튼을 눌러 코딩하고, 종이컵 쓰러트리기 게임도 해보았답니다. 테일봇과 함께 한 첫 시간이여서 더욱 즐거웠던 것 같아요!"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/014_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": "오늘 수업에 대한 친구들의 생각을 말해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/images/015_c448dddf_크기변환자산-23.jpg"}, {"type": "quiz", "question": "오늘 수업은 즐거웠나요?", "options": ["예", "아니오"]}, {"type": "quiz", "question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요.", "보통이에요.", "어려웠어요."]}, {"type": "quiz", "question": "어떤 활동이 재미있었나요?", "options": ["동영상 감상", "퀴즈 맞추기", "코딩 놀이"]}], "displayName": "08 3. 수업 마무리"}], "stages": [{"label": "수업 소개", "displayName": "01 수업 소개", "type": "intro", "title": "1. 영상 학습", "bubble": "스토리텔링으로 재미있게 코딩하는 ‘테일봇 코딩 어드벤처’ 수업에 온 걸 환영해요! ‘테일봇’은 로봇에 있는 버튼만 누르면 간단하게 코딩할 수 있기 때문에 코딩이 처음인 친구들도 쉽고 즐겁게 참여할 수 있답니다.", "teacherTalk": "인사 후 오늘 수업의 흐름을 짧게 안내하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-테일봇-너는-누구니/assets/imag     function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];

        if (s.image) blocks.push({ type: "image", src: s.image });

          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        const align = ["left", "center", "right"].includes(b.align)
          ? b.align
          : (t === "image" || t === "gallery" || t === "h5p" ? "center" : "left");
        const size = ["sm", "md", "lg"].includes(b.size) ? b.size : "md";
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = `blk-heading align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = `blk-text align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-image size-${size} align-${align}` + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = `blk-gallery align-${align}`;
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-h5p size-${size} align-${align}`;
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) {
        reflowQueued = true;
        return;
      }
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
        notifyReflow();
      } finally {
        reflowing = false;
        if (reflowQueued) {
          reflowQueued = false;
          scheduleReflow();
        }
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    /** 편집기는 플레이어 HTML이 나눈 페이지 구성을 그대로 따른다 */
    function notifyReflow() {
      try {
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage(
          {
            type: "crayon-reflow",
            pageIndex: index,
            pages: pages.map((p) => ({
              kicker: p.kicker || "",
              title: p.title || "",
              displayName: p.displayName || "",
              kind: p.kind || "topic",
              blocks: JSON.parse(JSON.stringify(p.blocks || [])),
            })),
          },
          "*"
        );
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n좌우 화살표 또는 키보드 ← →`
        : "좌우 화살표 또는 키보드 ← →";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
</body>
</html>
