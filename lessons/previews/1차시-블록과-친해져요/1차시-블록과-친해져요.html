<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1600px, calc(100% - 24px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 48px 24px; /* 좌우 화살표 자리 */
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .align-left { text-align: left; margin-left: 0; margin-right: auto; }
    .align-center { text-align: center; margin-left: auto; margin-right: auto; }
    .align-right { text-align: right; margin-left: auto; margin-right: 0; }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image.size-sm { width: min(42%, 280px); }
    .blk-image.size-md { width: min(72%, 560px); }
    .blk-image.size-lg { width: 100%; }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-image.size-sm img { max-height: min(28dvh, 260px); }
    .blk-image.size-lg img { max-height: min(52dvh, 560px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p.size-sm { width: min(52%, 420px); }
    .blk-h5p.size-md { width: min(78%, 720px); }
    .blk-h5p.size-lg { width: 100%; }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      height: min(32dvh, 360px);
      min-height: 220px;
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-h5p.size-sm iframe { height: min(24dvh, 260px); min-height: 180px; }
    .blk-h5p.size-md iframe { height: min(32dvh, 360px); min-height: 220px; }
    .blk-h5p.size-lg iframe { height: min(42dvh, 480px); min-height: 280px; }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 작은 좌우 화살표 (전체 영역 클릭 아님) */
    .nav-hit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 6;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 2px 10px rgba(60, 40, 20, 0.08);
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      opacity: 0.85;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .nav-hit:hover:not(:disabled) { opacity: 1; background: #fff; }
    .nav-hit.prev { left: 8px; }
    .nav-hit.next { right: 8px; }
    .nav-hit:disabled {
      opacity: 0.28;
      cursor: default;
      box-shadow: none;
    }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 40px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 32px; height: 32px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지">‹</button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지">›</button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">좌우 작은 화살표 또는 키보드 ← → 로 페이지를 넘깁니다.</p>
      </div>
    </div>
  </div>

  <script>
    let lessonData = {"mode": "blocks", "level": "팀보로봇 퍼스트, 손으로 만지면서 코딩하는 신개념 로봇블록", "title": "1차시. 블록과 친해져요!", "sourceUrl": "https://crayonschool.co.kr/lessons/1%ec%b0%a8%ec%8b%9c-%eb%b8%94%eb%a1%9d%ea%b3%bc-%ec%b9%9c%ed%95%b4%ec%a0%b8%ec%9a%94/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["인터랙티브 영상으로 퍼즐미션에 도전한다.", "「2. 놀이 활동」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "1차시. 블록과 친해져요!", "kind": "lesson", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/001_bf12b581_교구-대표사진-e1670982038452.jpg"}, {"type": "text", "text": "팀보로봇 퍼스트 키트"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/002_3fc292ea_가정준비물_스케치북.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/003_989f282b_가정준비물_색연필-e1667454344487.jpg"]}, {"type": "text", "text": "종이, 색연필"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/004_80218160_차시안내_오늘의-활동.jpg"}, {"type": "text", "text": "팀보로봇 블록의 여러 명칭과 생김새를 알아봐요. 블록을 연결하는 방법도 알아봐요. 다양한 블록놀이를 해봐요."}], "displayName": "01 1차시. 블록과 친해져요!"}, {"kicker": "1. 영상 학습", "title": "1. 영상 학습", "kind": "topic", "blocks": [{"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/005_48db1514_수업소개하기_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/006_aa329cb8_친구들반가워요_수정.jpg"]}], "displayName": "02 1. 영상 학습"}, {"kicker": "1. 영상 학습", "title": "<팀보로봇>", "kind": "topic", "blocks": [{"type": "heading", "text": "<팀보로봇>"}, {"type": "text", "text": "수업에 온 친구들 환영해요! 우리는 앞으로 12번의 수업 동안 팀보로봇 세계로 떠나 볼 거예요. 코딩미션들을 수행하며 다양한 모형들도 만들어보고, 즐거운 게임도 해볼 거랍니다. 너무너무 기대되고 신나요! 그럼 먼저 팀보로봇 블록에 대해 알아보도록 해요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/007_816b3592_생각나누기_수정.jpg"}, {"type": "divider"}, {"type": "text", "text": "블록 놀이를 좋아하나요? 블록으로 무엇을 만들어 보았나요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/008_1f14fa94_생각활동1_수정.jpg"}, {"type": "text", "text": "로봇도 만들어 보았나요? 로봇은 어떻게 생겼나요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/009_f0f29a4a_생각활동2_수정.jpg"}, {"type": "text", "text": "팀보로봇 블록으로는 집이나 동물뿐만 아니라 ‘움직이는’ 자동차 또는 로봇도 만들 수 있대요. 친구들은 어떤 것을 만들어보고 싶나요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/010_5963c446_생각활동3_수정.jpg"}, {"type": "divider"}, {"type": "text", "text": "그래요. 친구들이 말한 것들을 팀보로봇 블록으로 만든다면 정말 멋질 거예요! 오늘은 팀 보로봇 블록의 색깔과 모양을 알아보도록 해요. 어떤 색과 어떤 모양, 어떤 크기의 블록들이 있을까요? 팀보로봇 세계로 떠나봐요. 출발!"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/011_27b7a25e_인터렉티브영상보기_수정.jpg"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1239", "title": "인터랙티브 #1239"}], "displayName": "03 <팀보로봇>"}, {"kicker": "2. 놀이 활동", "title": "2. 놀이 활동", "kind": "topic", "blocks": [{"type": "text", "text": "영상을 통해 ‘팀보로봇’ 블록들의 특징을 알아보았어요. ‘잭과 콩나무’ 게임도 해보니 더욱 재미있었을 것 같아요. 이번에는 블록을 사용해서 얼굴 만들기 놀이를 해보도록 해요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/012_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "팀보로봇 블럭, 종이, 색연필을 준비해주세요."}, {"type": "text", "text": "얼굴을 만들어요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/013_1fa4ba45_크기변환놀이활동-01-e1667368387369.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/014_3e6b6a2b_스크린샷-2022-12-02-오후-3.33.14.png"]}, {"type": "text", "text": "내 얼굴을 만져봐요. 눈썹은 어디에 있나요? 어떻게 생겼나요? 눈은 어디에 있나요? 어떻게 생겼나요? 코은 어디에 있나요? 어떻게 생겼나요? 입은 어디에 있나요? 어떻게 생겼나요? 이제 영상을 먼저 볼 거예요. 활동 방법을 확인한 후, 블록으로 내 얼굴을 만들어봐요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/015_cba6e67a_MicrosoftTeams-image.jpg.jpg"}, {"type": "text", "text": "친구를 그려봐요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/016_ccb5ab03_크기변환놀이활동-02-e1667368370185.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/017_61fde379_스크린샷-2022-12-02-오후-4.39.00.png"]}, {"type": "text", "text": "위 활동지를 봐요. 그림에 무엇이 없나요? 두명씩 짝을 지어요. 그리고 위 활동지 그림처럼, 친구의 얼굴, 눈썹, 눈, 코, 입을 그려주세요. 머리카락은 블록으로 만들거니까 비워둬야 해요. 친구들의 머리를 살펴봐요. 친구들의 헤어스타일은 어떤가요? 긴 생머리? 파마머리? 짧은 스포츠머리? 이제 영상을 먼저 볼 거예요. 활동 방법을 확인한 후, 블록으로 친구의 멋진 헤어스타일을 완성해봐요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/015_cba6e67a_MicrosoftTeams-image.jpg.jpg"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1241", "title": "인터랙티브 #1241"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1522", "title": "인터랙티브 #1522"}], "displayName": "04 2. 놀이 활동"}, {"kicker": "3. 수업 마무리", "title": "3. 수업 마무리", "kind": "quiz", "blocks": [{"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/018_aecc9ff6_회상하기_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/019_47e6ca9b_활동을정리해요_수정.jpg"]}, {"type": "text", "text": "오늘은 팀보로봇 블록의 여러 명칭과 생김새를 알아보았어요. 그리고 다양한 활동을 통해 블록을 연결하는 법도 익혀보았답니다. 앞으로 팀보로봇 블록으로 어떤 것들을 만들게 될지, 정말 기대되는걸요! 참 잘했어요, 친구들!"}, {"type": "text", "text": "오늘 수업에 대한 친구들의 생각을 말해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/assets/images/020_011cd377_평가하기_수정.jpg"}, {"type": "quiz", "question": "오늘 수업은 즐거웠나요?", "options": ["예", "아니오"]}, {"type": "quiz", "question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요", "보통이에요", "어려웠어요"]}, {"type": "quiz", "question": "어떤 활동이 재미있었나요?", "options": ["동영상 감상", "잭과 콩나무 게임하기", "얼굴 만들기", "헤어스타일 만들기"]}], "displayName": "05 3. 수업 마무리"}], "stages": [{"label": "수업 소개", "displayName": "01 수업 소개", "type": "intro", "title": "1. 영상 학습", "bubble": "수업에 온 친구들 환영해요! 우리는 앞으로 12번의 수업 동안 팀보로봇 세계로 떠나 볼 거예요. 코딩미션들을 수행하며 다양한 모형들도 만들어보고, 즐거운 게임도 해볼 거랍니다. 너무너무 기대되고 신나요! 그럼 먼저 팀보로봇 블록에 대해 알아보도록 해요.", "teacherTalk": "인사 후 오늘 수업의 흐름을 짧게 안내하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/1차시-블록과-친해져요/asset 나요?", "quiz": {"question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요", "보통이에요", "어려웠어요"], "correctIndex": 0, "correctFeedback": "고마워요! 생각을 말해줘서 좋아요.", "wrongFeedback": "고마워요! 생각을 말해줘서 좋아요."}, "teacherTalk": "응답을 확인하세요."}, {"displayName": "07 평가하기", "title": "어떤 활동이 재미있었나요?", "bubble": "어떤 활동이 재미있었나요?", "quiz": {"question": "어떤 활동이 재미있었나요?", "options": ["동영상 감상", "잭과 콩나무 게임하기", "얼굴 만들기", "헤어스타일 만들기"], "correctIndex": 0, "correctFeedback": "고마워요! 생각을 말해줘서 좋아요.", "wrongFeedback": "고마워요! 생각을 말해줘서 좋아요."}, "teacherTalk": "응답을 확인하세요."}, {"displayName": "07 Bye!", "title": "다음 시간에 또 만나요", "bubble": "오늘 수업에 열심히 참여한 친구들, 고마워요!\n그럼 다음 시간에 또 만나요.", "teacherTalk": "가정연계를 안내하며 마무리합니다.", "isClosingFinale": true, "homework": "부모님·친구들과 오늘 배운 활동을 다시 해보세요."}], "homework": "부모님·친구들과 오늘 배운 활동을 다시 해보세요."}]};
    let index = 0;
    let sourcePages = [];
    let pages = [];
    let reflowTimer = null;
    let reflowing = false;
    let reflowQueued = false;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        const align = ["left", "center", "right"].includes(b.align)
          ? b.align
          : (t === "image" || t === "gallery" || t === "h5p" ? "center" : "left");
        const size = ["sm", "md", "lg"].includes(b.size) ? b.size : "md";
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = `blk-heading align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = `blk-text align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-image size-${size} align-${align}` + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = `blk-gallery align-${align}`;
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-h5p size-${size} align-${align}`;
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) {
        reflowQueued = true;
        return;
      }
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
        notifyReflow();
      } finally {
        reflowing = false;
        if (reflowQueued) {
          reflowQueued = false;
          scheduleReflow();
        }
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    /** 편집기는 플레이어 HTML이 나눈 페이지 구성을 그대로 따른다 */
    function notifyReflow() {
      try {
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage(
          {
            type: "crayon-reflow",
            pageIndex: index,
            pages: pages.map((p) => ({
              kicker: p.kicker || "",
              title: p.title || "",
              displayName: p.displayName || "",
              kind: p.kind || "topic",
              blocks: JSON.parse(JSON.stringify(p.blocks || [])),
            })),
          },
          "*"
        );
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n좌우 화살표 또는 키보드 ← →`
        : "좌우 화살표 또는 키보드 ← →";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
