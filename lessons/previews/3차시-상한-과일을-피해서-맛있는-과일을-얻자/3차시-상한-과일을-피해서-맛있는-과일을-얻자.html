<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1600px, calc(100% - 24px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 48px 24px; /* 좌우 화살표 자리 */
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .align-left { text-align: left; margin-left: 0; margin-right: auto; }
    .align-center { text-align: center; margin-left: auto; margin-right: auto; }
    .align-right { text-align: right; margin-left: auto; margin-right: 0; }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image.size-sm { width: min(42%, 280px); }
    .blk-image.size-md { width: min(72%, 560px); }
    .blk-image.size-lg { width: 100%; }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-image.size-sm img { max-height: min(28dvh, 260px); }
    .blk-image.size-lg img { max-height: min(52dvh, 560px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p.size-sm { width: min(52%, 420px); }
    .blk-h5p.size-md { width: min(78%, 720px); }
    .blk-h5p.size-lg { width: 100%; }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      height: min(32dvh, 360px);
      min-height: 220px;
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-h5p.size-sm iframe { height: min(24dvh, 260px); min-height: 180px; }
    .blk-h5p.size-md iframe { height: min(32dvh, 360px); min-height: 220px; }
    .blk-h5p.size-lg iframe { height: min(42dvh, 480px); min-height: 280px; }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 작은 좌우 화살표 (전체 영역 클릭 아님) */
    .nav-hit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 6;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 2px 10px rgba(60, 40, 20, 0.08);
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      opacity: 0.85;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .nav-hit:hover:not(:disabled) { opacity: 1; background: #fff; }
    .nav-hit.prev { left: 8px; }
    .nav-hit.next { right: 8px; }
    .nav-hit:disabled {
      opacity: 0.28;
      cursor: default;
      box-shadow: none;
    }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 40px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 32px; height: 32px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지">‹</button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지">›</button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">좌우 작은 화살표 또는 키보드 ← → 로 페이지를 넘깁니다.</p>
      </div>
    </div>
  </div>

: "01 3차시. 상한 과일을 피해서 맛있는 과일을 얻자!"}, {"kicker": "1. 영상 학습", "title": "1. 영상 학습", "kind": "topic", "blocks": [{"type": "text", "text": "스토리텔링으로 재밌게 코딩하는 <테일봇> 수업에 온 친구들 환영해요! ​ 지난 시간에는 테일봇과 여러 가지 모양에 대해 알아보고 재밌는 코딩 놀이를 해보았어요 . ​ 오늘은 테일봇과 몸에 좋고 알록달록한 과일 , 채소에 대해 알아보고 재밌는 코딩 놀이를 해볼거예요 . 그럼 테일봇과 즐거운 코딩 세계로 떠날 준비되었나요 ? 자 , 출발 ! ​"}, {"type": "text", "text": "내가 알고 있는 과일과 채소는 무엇이 있나요 ? ​ → 과일은 나무에서 자라는 열매로 복숭아 , 감 , 사과 , 바나나 등이 있어요 . ​ 채소는 땅에서 나는 것을 이야기하고 당근 , 양파 , 양배추 등이 있어요 . ​"}, {"type": "text", "text": "토마토는 과일일까요 채소일까요 ?"}, {"type": "text", "text": "과일과 채소를 왜 많이 먹어야 할까요 ? → 고기나 우유 같은 음식들을 많이 먹으면 환경이 오염된다고 해요 . ​ 지구가 아프지 않도록 과일과 채소를 많이 먹으면 좋겠죠 ? ​ 하지만 , 상한 과일이나 채소를 먹진 않도록 조심해야 한답니다 . ​"}, {"type": "text", "text": "[새콤달콤 맛있는 과일과 채소] 맵을 살펴보아요. 맵의 가장 왼쪽에는 어떤 색깔들이 있나요 ? 내가 좋아하는 색을 말해보세요 . ​ 빨간색 과일과 채소는 무엇이 있을까요 ? 맵을 살펴보고 말해보세요 . ​"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/006_ace15020_탐색하기2.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/007_4607266a_교구활동1_수정.jpg"]}, {"type": "text", "text": "[ 새콤달콤 맛있는 과일과 채소 ] 맵에는 다양한 과일과 채소들이 있네요 . ​ 이번 시간에는 우리가 직접 코딩해서 테일봇이 상한 채소와 과일들을 피해 ​ 원하는 과일과 채소를 찾아가게 만들어볼거예요 . ​ 그럼 , 오늘 수업을 힘차게 시작해볼까요 ? ​"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1793", "title": "인터랙티브 #1793"}], "displayName": "02 1. 영상 학습"}, {"kicker": "2. 연계 활동", "title": "2. 연계 활동", "kind": "topic", "blocks": [{"type": "text", "text": "영상 학습을 통해 테일봇을 이용해서 같은 색깔의 채소와 과일들을 찾는 법에 대해 배웠어요. 테일봇을 코딩해보면서 복잡한 코딩에도 점점 익숙해지는 것 같아요."}, {"type": "text", "text": "그럼 테일봇과 함께 즐거운 놀이활동을 해 볼까요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/008_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "테일봇, 활동지, 가위, 풀을 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/009_1fa4ba45_크기변환놀이활동-01-e1667368387369.jpg"}, {"type": "text", "text": "친구와 함께하는 <‘채소를 찾아라’ 게임>"}], "displayName": "03 2. 연계 활동"}, {"kicker": "2. 연계 활동", "title": "<준비하기>", "kind": "topic", "blocks": [{"type": "heading", "text": "<준비하기>"}, {"type": "text", "text": "활동지 1p의 주사위를 오려서 만들어요. 활동지 2p의 그림 카드를 오린 후 맵의 원하는 칸에 붙여요."}, {"type": "text", "text": "주사위는 풀을 붙여 완성하고, 활동맵 위에 그림 카드는 한쪽에 몰리지 않게 골고루 붙여요."}], "displayName": "04 <준비하기>"}, {"kicker": "2. 연계 활동", "title": "<게임 규칙>", "kind": "topic", "blocks": [{"type": "heading", "text": "<게임 규칙>"}, {"type": "text", "text": "주사위를 굴려 나온 숫자만큼 버튼을 누를 수 있어요. 테일봇을 움직여 채소에 멈추면 1점을 얻고, 동물성 음식에 멈추면 점수를얻지 못해요. 만약 주사위가 3이 나오면 ‘앞으로, 왼쪽으로 회전, 앞으로’와 같이 버튼을 3개(3번)까지 누를 수 있어요. 단, 시작 버튼은 포함하지 않아요. 주사위는 총 5번을 굴리고 점수를 더 많이 얻는 친구가 이기는 게임이에요. 출발 위치에 멈추면 점수를 얻을 수 없으므로 출발 위치를 피할 수 있도록 코딩해요."}, {"type": "text", "text": "*5번 주사위를 굴렸을 경우 주사위 수만큼 코딩한 예시"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/010_39283b9c_테일봇3차시_활동예시1-1.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/011_d92e126b_테일봇3차시_활동예시2-1.png"]}], "displayName": "05 <게임 규칙>"}, {"kicker": "2. 연계 활동", "title": "<게임하기>", "kind": "topic", "blocks": [{"type": "heading", "text": "<게임하기>"}, {"type": "text", "text": "주사위를 굴려서 큰 수가 나온 친구부터 시작해요. 출발 버튼에 테일봇을 올리고 주사위를 굴려요. 게임이 반복되면 점수를 변경하여 게임을 진행할 수도 있어요. (예 : 식물성 음식 도착 시 3점 획득 / 동물성 음식 도착 시 1점 감소) 이긴 친구는 테일봇의 춤추기 버튼을 눌러서 기쁨을 표현해요."}], "displayName": "06 <게임하기>"}, {"kicker": "3. 수업 마무리", "title": "3. 수업 마무리", "kind": "quiz", "blocks": [{"type": "text", "text": "오늘은 테일봇과 함께 몸에 좋은 과일과 야채를 알아보았어요 . 우리의 건강을 지키기 위해 서는 과일과 채소가 상하지 않았는지 잘 확인하고 먹어야 한다는 것도 게임을 통해 알 수 있었어요 . 맵을 이용해 다양한 놀이도 할 수 있어서 더 즐거운 시간이었어요 ! ​"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/012_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": "오늘 수업에 대한 친구들의 생각을 말해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/013_c448dddf_크기변환자산-23.jpg"}, {"type": "quiz", "question": "오늘 수업은 즐거웠나요?", "options": ["네", "아니오"]}, {"type": "quiz", "question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요", "보통이에요", "어려웠어요"]}, {"type": "quiz", "question": "어떤 활동이 재밌었나요?", "options": ["생각 나누기", "동영상 감상", "코딩 활동"]}], "displayName": "07 3. 수업 마무리"}], "stages": [{"label": "수업 소개", "displayName": "01 수업 소개", "type": "intro", "title": "1. 영상 학습", "bubble": "스토리텔링으로 재밌게 코딩하는 <테일봇> 수업에 온 친구들 환영해요! ​ 지난 시간에는 테일봇과 여러 가지 모양에 대해 알아보고 재밌는 코딩 놀이를 해보았어요 . ​ 오늘은 테일봇과 몸에 좋고 알록달록한 과일 , 채소에 대해 알아보고 재밌는 코딩 놀이를 해볼거예요 . 그럼 테일봇과 즐거운 코딩 세계로 떠날 준비되었나요 ? 자 , 출발 ! ​", "teacherTalk": "인사 후 오늘 수업의 흐름을 짧게 안내하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/006_ace15020_탐색하기2.png"}, {"label": "생각나누기", "displayName": "02 생각나누기", "type": "discussion", "title": "함께 이야기해요", "bubble": "내가 알고 있는 과일과 채소는 무엇이 있나요 ?", "teacherTalk": "질문에 자유롭게 답하게 한 뒤 영상으로 연결하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-august-lessons-48d2/lessons/previews/3차시-상한-과일을-피해서-맛있는-과일을-얻자/assets/images/006_ace15020_탐색하기2.png", "discussionPages": [{"bubble": "내가 알고 있는 과일과 채소는 무엇이 있나요 ?", "teacherTalk": "아이 응답을 들어주세     let index = 0;
    let sourcePages = [];
    let pages = [];
    let reflowTimer = null;
    let reflowing = false;
    let reflowQueued = false;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        const align = ["left", "center", "right"].includes(b.align)
          ? b.align
          : (t === "image" || t === "gallery" || t === "h5p" ? "center" : "left");
        const size = ["sm", "md", "lg"].includes(b.size) ? b.size : "md";
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = `blk-heading align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = `blk-text align-${align}`;
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-image size-${size} align-${align}` + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = `blk-gallery align-${align}`;
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = `blk-h5p size-${size} align-${align}`;
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) {
        reflowQueued = true;
        return;
      }
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
        notifyReflow();
      } finally {
        reflowing = false;
        if (reflowQueued) {
          reflowQueued = false;
          scheduleReflow();
        }
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    /** 편집기는 플레이어 HTML이 나눈 페이지 구성을 그대로 따른다 */
    function notifyReflow() {
      try {
        if (!window.parent || window.parent === window) return;
        window.parent.postMessage(
          {
            type: "crayon-reflow",
            pageIndex: index,
            pages: pages.map((p) => ({
              kicker: p.kicker || "",
              title: p.title || "",
              displayName: p.displayName || "",
              kind: p.kind || "topic",
              blocks: JSON.parse(JSON.stringify(p.blocks || [])),
            })),
          },
          "*"
        );
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n좌우 화살표 또는 키보드 ← →`
        : "좌우 화살표 또는 키보드 ← →";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
</body>
</html>
