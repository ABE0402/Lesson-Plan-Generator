<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1100px, calc(100% - 16px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 22px 24px;
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      min-height: min(48dvh, 520px);
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 좌우 클릭 이동 영역 */
    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 6;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .nav-hit.prev { left: 0; cursor: w-resize; }
    .nav-hit.next { right: 0; cursor: e-resize; }
    .nav-hit:disabled { cursor: default; }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 14px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 24%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지"></button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지"></button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">화면 왼쪽을 누르면 이전, 오른쪽을 누르면 다음 페이지입니다.</p>
      </div>
    </div>
  </div>

  <script>
    let lessonData = {"mode": "blocks", "level": "스토리텔링 코딩로봇 테일봇과 함께하는 코딩 어드벤처", "title": "4차시. 과일의 수를 세보자!", "sourceUrl": "https://crayonschool.co.kr/lessons/4%ec%b0%a8%ec%8b%9c-%ea%b3%bc%ec%9d%bc%ec%9d%98-%ec%88%98%eb%a5%bc-%ec%84%b8%eb%b3%b4%ec%9e%90/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["인터랙티브 영상으로 퍼즐미션에 도전한다.", "「2. 연계 활동」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "4차시. 과일의 수를 세보자!", "kind": "lesson", "blocks": [{"type": "text", "text": "[마르시스에듀] 테일봇, 수세기 맵"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/001_dbcfa2d5_웹-캡처_25-10-2023_173540_smartstore.naver_.com_.jpeg"}, {"type": "text", "text": "8*8cm 사이즈의 종이"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/002_ecd3e085_가정준비물_도화지.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/003_80218160_차시안내_오늘의-활동.jpg"]}, {"type": "text", "text": "과일의 수를 세는 법에 대해 배워요. 같은 수의 과일들을 찾아보아요. 덧셈, 뺄셈 계산을 통해 문제의 답을 구해봐요. 계산을 통해 얻은 답을 테일봇 코딩으로 맞혀봐요."}], "displayName": "01 4차시. 과일의 수를 세보자!"}, {"kicker": "1. 영상 학습", "title": "1. 영상 학습", "kind": "topic", "blocks": [{"type": "text", "text": "스토리텔링으로 재밌게 코딩하는 <테일봇> 수업에 온 친구들 환영해요! ​ 지난 시간에는 테일봇과 몸에 좋고 알록달록한 과일, 채소에 대해 알아보고 재밌는 코딩 놀이를 해봤어요. 오늘은 테일봇과 숫자를 알아보고 알쏭달쏭 수 놀이의 답을 코딩으로 알아볼 거예요. 그럼 테일봇과 즐거운 코딩 세계로 떠날 준비 되었나요? 자, 출발!"}, {"type": "text", "text": "내가 알고 있는 숫자에 대한 경험을 이야기 나눠요. ​"}, {"type": "text", "text": "내가 알고 있는 숫자에 대해 말해보세요.(나이, 키, 몸무게, 전화번호, 자동차 번호 등) 우리는 몇 명의 친구들이 모여있는지 세어볼까요? 선생님까지 수를 합하면 모두 몇 명일까요?"}, {"type": "text", "text": "‘숫자’는 우리 생활 속, 주변에서도 많이 접할 수 있네요. 우리 모두 기억해두고 있던 숫자들이 다 달라서 이야기를 나누는 게 더 즐거운 것 같아요. ​"}, {"type": "text", "text": "[수 세기 게임] 맵을 살펴보아요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/004_ace15020_탐색하기2.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/005_4607266a_교구활동1_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/006_65f70c52_코딩맵1_수세기게임-1-1024x694.png"]}, {"type": "text", "text": "맵의 가장 왼쪽에는 어떤 무엇이 보이나요? 동그란 점의 수를 세어보고 수를 읽어보세요. ​ 맵 위에는 어떤 과일이 놓여져 있나요? 가장 많은 딸기는 몇 개인가요? ​"}, {"type": "text", "text": "[수 세기 게임] 맵에서는 다양한 숫자들과 다양한 개수의 딸기들을 찾아볼 수 있어요. 이번 수업에서는 이 딸기들을 이용해서 어떤 놀이를 하고, 또 어떤 코딩을 할 수 있을 지 궁금하네요."}, {"type": "text", "text": "그럼 , 오늘 수업을 힘차게 시작해볼까요 ? ​"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1808", "title": "인터랙티브 #1808"}], "displayName": "02 1. 영상 학습"}, {"kicker": "2. 연계 활동", "title": "2. 연계 활동", "kind": "topic", "blocks": [{"type": "text", "text": "영상 학습을 통해 테일봇을 이용해서 같은 개수의 딸기들을 찾는 법에 대해 배웠어요. 덧셈과 뺄셈을 이용한 계산도 해보고, 문제의 답을 코딩으로 맞혀보니 정말 신기하고 재밌는 것 같아요."}, {"type": "text", "text": "그럼 테일봇과 함께 즐거운 놀이활동을 해 볼까요 ? ​"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/007_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "테일봇, [수세기 게임 맵]을 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/008_1fa4ba45_크기변환놀이활동-01-e1667368387369.jpg"}], "displayName": "03 2. 연계 활동"}, {"kicker": "2. 연계 활동", "title": "<덧셈 수 놀이>", "kind": "topic", "blocks": [{"type": "heading", "text": "<덧셈 수 놀이>"}, {"type": "text", "text": "딸기 농장에 놀러갔어요. 친구는 딸기 4개를 따고, 동생은 딸기 3개를 땄어요. 모두 몇 개의 딸기를 땄을까요? 맵 왼쪽 위의 카드에서 정답을 고른 후 테일봇을 올려 인식시키세요. 출발 지점에 테일봇을 놓고 정답까지 움직이도록 코딩해보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/009_f0619dc2_코딩맵1_수세기게임-1024x694.png"}], "displayName": "04 <덧셈 수 놀이>"}, {"kicker": "2. 연계 활동", "title": "<뺄셈 수 놀이>", "kind": "topic", "blocks": [{"type": "heading", "text": "<뺄셈 수 놀이>"}, {"type": "text", "text": "접시에 6개의 딸기가 있었는데, 2개를 먹었어요. 몇 개가 남았을까요? 맵 왼쪽 위의 카드에서 정답을 고른 후 테일봇을 올려 인식시키세요. 출발 지점에 테일봇을 놓고 정답까지 움직이도록 코딩해보세요."}, {"type": "text", "text": "이 외에도 다양한 덧셈, 뺄셈 문제를 내고 답을 찾아보는 수 놀이를 해볼 수 있어요."}, {"type": "text", "text": "테일봇, [수세기 게임 맵], 종이 3장(8*8), 연필을 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/010_e64e3be4_크기변환놀이활동-02.jpg"}], "displayName": "05 <뺄셈 수 놀이>"}, {"kicker": "2. 연계 활동", "title": "<더 많은 숫자들로 해보는 수 놀이>", "kind": "topic", "blocks": [{"type": "heading", "text": "<더 많은 숫자들로 해보는 수 놀이>"}, {"type": "text", "text": "준비한 종이를 이용해 7보다 더 큰 수들도 맵에 써서 올려놓으세요."}, {"type": "text", "text": "친구에게 더하기, 빼기 문제를 내고 답을 찾는 코딩을 해보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/011_2510d492_제목을-입력해주세요_-001-16-1024x694.png"}], "displayName": "06 <더 많은 숫자들로 해보는 수 놀이>"}, {"kicker": "3. 수업 마무리", "title": "3. 수업 마무리", "kind": "quiz", "blocks": [{"type": "text", "text": "오늘은 테일봇과 함께 재밌는 수 놀이를 해보았어요. 숫자를 세어보기도 하고 더 많은 숫자를 만들어서 맵에서 재미있는 게임도 해볼 수 있어서 더 즐거운 시간이었어요!"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/4차시-과일의-수를-세보자/assets/images/012_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": " ble": "어떤 활동이 재밌었나요?", "quiz": {"question": "어떤 활동이 재밌었나요?", "options": ["생각 나누기", "동영상 감상", "코딩 활동"], "correctIndex": 0, "correctFeedback": "고마워요! 생각을 말해줘서 좋아요.", "wrongFeedback": "고마워요! 생각을 말해줘서 좋아요."}, "teacherTalk": "응답을 확인하세요."}, {"displayName": "05 Bye!", "title": "다음 시간에 또 만나요", "bubble": "오늘 수업에 열심히 참여한 친구들, 고마워요!\n그럼 다음 시간에 또 만나요.", "teacherTalk": "가정연계를 안내하며 마무리합니다.", "isClosingFinale": true, "homework": "부모님·친구들과 오늘 배운 활동을 다시 해보세요."}], "homework": "부모님·친구들과 오늘 배운 활동을 다시 해보세요."}]};
    let index = 0;
    let sourcePages = [];
    let pages = [];
    let reflowTimer = null;
    let reflowing = false;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = "blk-heading";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = "blk-text";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-image" + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = "blk-gallery";
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-h5p";
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) return;
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
      } finally {
        reflowing = false;
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n왼쪽 클릭=이전, 오른쪽 클릭=다음`
        : "왼쪽 클릭=이전, 오른쪽 클릭=다음";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
