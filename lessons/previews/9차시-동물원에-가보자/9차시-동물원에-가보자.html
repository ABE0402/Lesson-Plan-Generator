<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1100px, calc(100% - 16px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 22px 24px;
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      min-height: min(48dvh, 520px);
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 좌우 클릭 이동 영역 */
    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 6;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .nav-hit.prev { left: 0; cursor: w-resize; }
    .nav-hit.next { right: 0; cursor: e-resize; }
    .nav-hit:disabled { cursor: default; }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 14px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 24%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지"></button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지"></button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">화면 왼쪽을 누르면 이전, 오른쪽을 누르면 다음 페이지입니다.</p>
      </div>
    </div>
  </div>

  <script>
    let lessonData = {"mode": "blocks", "level": "스토리텔링 코딩로봇 테일봇과 함께하는 코딩 어드벤처", "title": "9차시. 동물원에 가보자!", "sourceUrl": "https://crayonschool.co.kr/lessons/9%ec%b0%a8%ec%8b%9c-%eb%8f%99%eb%ac%bc%ec%9b%90%ec%97%90-%ea%b0%80%eb%b3%b4%ec%9e%90/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["인터랙티브 영상으로 퍼즐미션에 도전한다.", "「2. 연계 활동」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "9차시. 동물원에 가보자!", "kind": "lesson", "blocks": [{"type": "text", "text": "[마르시스에듀] 테일봇, 동물원 나들이 맵"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/001_dbcfa2d5_웹-캡처_25-10-2023_173540_smartstore.naver_.com_.jpeg"}, {"type": "text", "text": "활동지(PDF)"}, {"type": "text", "text": "활동지는 미리 출력하여 준비해 주세요."}, {"type": "text", "text": "가위, 종이, 필기도구"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/002_8aed41ed_가위.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/003_83c1a4c1_가정준비물_연필.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/004_ecd3e085_가정준비물_도화지.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/005_80218160_차시안내_오늘의-활동.jpg"]}, {"type": "text", "text": "다양한 동물들에 대해 알아봐요. 동물을 지키는 방법에 대해 배워요. 테일봇을 이용해 동물들을 구하는 코딩을 직접 해보아요. 여러 목적지를 거쳐서 최종 목적지에 도착하는 코딩을 해보아요."}], "displayName": "01 9차시. 동물원에 가보자!"}, {"kicker": "1. 영상 학습", "title": "1. 영상 학습", "kind": "topic", "blocks": [{"type": "text", "text": "스토리텔링으로 재밌게 코딩하는 <테일봇> 수업에 온 친구들 환영해요! ​ 지난 시간에는 올챙이가 개구리가 되기까지의 개구리의 한살이를 코딩을 통해 알아보았어요. 오늘은 테일봇과 동물의 소중함을 알고 동물을 지키는 방법을 코딩 활동으로 알아볼거예요. 그럼 테일봇과 즐거운 코딩 세계로 떠날 준비되었나요 ? 자 , 출발 ! ​"}, {"type": "text", "text": "동물원에 가본 적 있나요? 어떤 동물을 보았나요? ​ ​"}, {"type": "text", "text": "동물원에 갇힌 동물들은 어떤 기분일까요? ​→ 수족관이나 동물원에 갇혀서 사람들의 시선과 소음에 노출되는 동물들은 스트레스를 받는다고 해요. 스트레스로 이상행동을 하기도 하고 아픈 동물들도 있답니다."}, {"type": "text", "text": "소중한 동물을 지킬 수 있는 방법은 무엇이 있을까요?"}, {"type": "text", "text": "[동물원 나들이] 맵을 살펴보아요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/006_ace15020_탐색하기2.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/007_4607266a_교구활동1_수정.jpg"]}, {"type": "text", "text": "각 칸 위에 어떤 그림들이 보이나요? ​ ‘소개’ 위에 테일봇을 올려놓고 동물들에 대한 설명을 들어보아요. ​"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/008_95e380f4_코딩맵4_동물원-1024x693.png"}, {"type": "text", "text": "[동물원 나들이 ] 맵에는 다양한 동물들이 있네요 . ​ 이번 시간에는 테일봇이 동물들을 만나고, 구해주도록 우리가 직접 코딩해 볼 거예요. ​ 그럼 , 오늘 수업을 힘차게 시작해볼까요 ? ​"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=1815", "title": "인터랙티브 #1815"}], "displayName": "02 1. 영상 학습"}, {"kicker": "2. 연계 활동", "title": "2. 연계 활동", "kind": "topic", "blocks": [{"type": "text", "text": "영상 학습을 통해 테일봇을 이용해서 여러 목적지를 거쳐 최종 목적지까지 가도록 코딩하는 법에 대해 배웠어요. 각각의 목적지에서 멈췄다 이동하게 코딩해보고, 한 번에 모두 지나가도록 코딩해보면서 우리의 코딩 실력이 많이 성장한 것 같아요."}, {"type": "text", "text": "그럼 테일봇과 함께 즐거운 놀이활동을 해 볼까요?"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/009_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "테일봇, 활동지, [동물원 나들이] 맵, 가위를 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/010_1fa4ba45_크기변환놀이활동-01-e1667368387369.jpg"}], "displayName": "03 2. 연계 활동"}, {"kicker": "2. 연계 활동", "title": "<동물원 구출 작전!>", "kind": "topic", "blocks": [{"type": "heading", "text": "<동물원 구출 작전!>"}], "displayName": "04 <동물원 구출 작전!>"}, {"kicker": "2. 연계 활동", "title": "<준비하기>", "kind": "topic", "blocks": [{"type": "heading", "text": "<준비하기>"}, {"type": "text", "text": "활동지 1p를 길게 오려서 동물들의 우리를 만들어요. 활동지 2p를 오려서 주사위를 만들어요."}], "displayName": "05 <준비하기>"}, {"kicker": "2. 연계 활동", "title": "<게임하기>", "kind": "topic", "blocks": [{"type": "heading", "text": "<게임하기>"}, {"type": "text", "text": "주사위를 굴려 우리의 개수를 정해요. 주사위로 정한 개수만큼 맵에 있는 동물들 중 원하는 동물들에 우리를 씌워요. 테일봇이 각 동물의 위치에 도착하도록 코딩해봐요. (테일봇이 도착하면 동물의 우리를 없애고, 동물이 탈출하도록 도울 수 있어요) 여러 목적지를 거치는 단 한 번의 코딩으로 테일봇이 모든 우리를 없애도록 코딩해보세요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/011_5b969bbb_제목을-입력해주세요__복사본-_5_-002-1024x694.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/012_e0f159c3_테일봇9차시연계활동예시2-1024x694.png"]}, {"type": "text", "text": "테일봇, 활동지, 가위를 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/013_e64e3be4_크기변환놀이활동-02.jpg"}], "displayName": "06 <게임하기>"}, {"kicker": "2. 연계 활동", "title": "<동물을 소중하게 생각해요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<동물을 소중하게 생각해요>"}, {"type": "text", "text": "활동지에서 그림카드를 오리고, 각 카드의 그림들을 보고 어떤 그림인지 이야기 해보아요. ​→ 그림1(고기) : 사람이 먹는 고기를 만들기 위해 동물들이 좁은 공간에서 길러져요. 고기를 만들기 위한 가축들이 자라면서 온실 가스를 배출해 환경 오염의 원인이 돼요. ​그림2(수족관) : 좁은 공간에서 갇혀 자라며 사람들의 시선과 시끄러운 소리 대문에 스트레스를 받을 수 있어요. 그림3(실험용 쥐) : 사람이 사용하는 화장품이나 의약품을 만들기 위해 실험에 쓰여져요. 그림4(동물의 가죽) : 옷이나 신발, 가방을 만들기 위해 동물들이 희생당해요."}, {"type": "text", "text": "그림카드들을 맵 위의 원하는 위치에 두고, 테일봇이 출발점에서 그림카드까지 이동하도록 코딩해봐요. 카드의 문제 상황을 어떻게 하면 나아지게 할 수 있을 지 녹음하여 말해보아요. (예: 고기 카드까지 테일봇을 이동시킨 후, “고기보다는 채소를 더 많이 먹어요” 라고 녹음해요.)"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/014_93f7b154_테일봇9차시연계활동예시-1024x694.png"}], "displayName": "07 <동물을 소중하게 생각해요>"}, {"kicker": "3. 수업 마무리", "title": "3. 수업 마무리", "kind": "quiz", "blocks": [{"type": "text", "text": "오늘은 테일봇과 함께 동물의 소중함에 대해 알아보았어요. 동물을 지키는 방법을 코딩활동을 통해 실천해보기도 했어요. 맵을 이용해 다양한 놀이도 할 수 있어서 더 즐거운 시간이었어요 ! ​"}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/015_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": "오늘 수업에 대한 친구들의 생각을 말해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/016_c448dddf_크기변환자산-23.jpg"}, {"type": "quiz", "question": "오늘 수업은 즐거웠나요?", "options": ["네", "아니오"]}, {"type": "quiz", "question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요", "보통이에요", "어려웠어요"]}, {"type": "quiz", "question": "어떤 활동이 재밌었나요?", "options": ["생각 나누기", "동영상 감상", "코딩 활동"]}], "displayName": "08 3. 수업 마무리"}], "stages": [{"label": "수업 소개", "displayName": "01 수업 소개", "type": "intro", "title": "1. 영상 학습", "bubble": "스토리텔링으로 재밌게 코딩하는 <테일봇> 수업에 온 친구들 환영해요! ​ 지난 시간에는 올챙이가 개구리가 되기까지의 개구리의 한살이를 코딩을 통해 알아보았어요. 오늘은 테일봇과 동물의 소중함을 알고 동물을 지키는 방법을 코딩 활동으로 알아볼거예요. 그럼 테일봇과 즐거운 코딩 세계로 떠날 준비되었나요 ? 자 , 출발 ! ​", "teacherTalk": "인사 후 오늘 수업의 흐름을 짧게 안내하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/9차시-동물원에-가보자/assets/images/006_ace15020_탐색하기2.png"}, {"label": "생각나누기", "displ     let index = 0;
    let sourcePages = [];
    let pages = [];
    let reflowTimer = null;
    let reflowing = false;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = "blk-heading";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = "blk-text";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-image" + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = "blk-gallery";
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-h5p";
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) return;
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
      } finally {
        reflowing = false;
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n왼쪽 클릭=이전, 오른쪽 클릭=다음`
        : "왼쪽 클릭=이전, 오른쪽 클릭=다음";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
</body>
</html>
