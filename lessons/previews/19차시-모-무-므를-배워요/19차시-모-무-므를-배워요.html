<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1100px, calc(100% - 16px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 22px 24px;
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      min-height: min(48dvh, 520px);
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 좌우 클릭 이동 영역 */
    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 6;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .nav-hit.prev { left: 0; cursor: w-resize; }
    .nav-hit.next { right: 0; cursor: e-resize; }
    .nav-hit:disabled { cursor: default; }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 14px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 24%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지"></button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지"></button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">화면 왼쪽을 누르면 이전, 오른쪽을 누르면 다음 페이지입니다.</p>
      </div>
    </div>
  </div>

  <script>
    let lessonData = {"mode": "blocks", "level": "글자블럭으로 재밌게! 손끝에서 만나는 한글", "title": "19차시. 모, 무, 므를 배워요", "sourceUrl": "https://crayonschool.co.kr/lessons/19%ec%b0%a8%ec%8b%9c-%eb%aa%a8-%eb%ac%b4-%eb%af%80%eb%a5%bc-%eb%b0%b0%ec%9b%8c%ec%9a%94/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["「1. 탐색 활동」에서 배운 내용을 응용·놀이한다.", "「2. 글자 학습」내용을 익힌다.", "「3. 글자 블럭 게임」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "19차시. 모, 무, 므를 배워요", "kind": "lesson", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/001_fb626355_상품구성_5호.png"}, {"type": "text", "text": "[플라팜] 한글 글자블럭, 미니레고판, 6세 5호 교재"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/002_989f282b_가정준비물_색연필-e1667454344487.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/003_80218160_차시안내_오늘의-활동.jpg"]}, {"type": "text", "text": "자음 ‘ㅁ’과 모음 ‘ㅗ, ㅜ, ㅡ’의 결합을 이해해요. 한글 글자블럭으로 ‘모, 무, 므’를 만들어요. ‘모, 무, 므’ 가 들어간 단어를 배워요. 빈 칸 퀴즈를 통해 공통으로 들어갈 글자를 파악하고 블럭으로 완성해요."}], "displayName": "01 19차시. 모, 무, 므를 배워요"}, {"kicker": "1. 탐색 활동", "title": "1. 탐색 활동", "kind": "topic", "blocks": [{"type": "text", "text": "글자 블럭으로 한글을 즐겁게 배우는 <손끝에서 만나는 한글> 열 아홉 번째 수업이에요. 지난 시간에는 글자 ‘마, 머, 미’ 를 배우고, 그 글자가 들어간 단어를 알아보았어요."}, {"type": "text", "text": "오늘은 글자 ‘모, 무, 므’ 를 배우고, 그 글자가 들어간 단어를 알아볼 거예요. 그리고 재밌는 게임을 통해 ‘모, 무, 므’ 의 힘이 깃든 글자 스티커도 모아볼 거랍니다. 오늘 수업도 기대되지요? 힘차게 시작해 볼까요!"}, {"type": "text", "text": "교재, 한글 글자블럭을 준비해주세요."}], "displayName": "02 1. 탐색 활동"}, {"kicker": "1. 탐색 활동", "title": "<‘ㅁ’ 블럭을 찾아요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘ㅁ’ 블럭을 찾아요>"}, {"type": "text", "text": "어둠의 힘에게 빼앗긴 ‘모, 무, 므’의 힘을 되찾기 위해선 특별한 블럭이 필요해요. 활동을 통해, 오늘 우리에게 필요한 블럭을 찾아보도록 해요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/004_4607266a_교구활동1_수정.jpg"}, {"type": "text", "text": "한글 글자블럭 중에서 ‘ㅁ’블럭 5개를 찾아보세요. 빨강, 노랑, 초록, 파랑, 흰색 ‘ㅁ’블럭이에요."}, {"type": "text", "text": "모두 찾았다면, 한 켠에 ‘ㅁ’블럭을 모아두세요."}], "displayName": "03 <‘ㅁ’ 블럭을 찾아요>"}, {"kicker": "1. 탐색 활동", "title": "<ㅗ, ㅜ, ㅡ 블럭을 찾아요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<ㅗ, ㅜ, ㅡ 블럭을 찾아요>"}, {"type": "text", "text": "이번에는 우리에게 필요한 모음 블럭을 찾아보도록 해요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/005_6ad8c47e_교구활동2_수정.jpg"}, {"type": "text", "text": "퀴즈를 풀어요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/006_1324635d_061.png"}, {"type": "text", "text": "한글 글자블럭 중에서 ‘ㅗ, ㅜ, ㅡ’ 블럭 5개씩 찾아보세요."}, {"type": "text", "text": "교재 13p를 펼친 후, 우리가 찾은 블럭을 알맞은 그림 위에 올려놓으세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2015", "title": "인터랙티브 #2015"}], "displayName": "04 <ㅗ, ㅜ, ㅡ 블럭을 찾아요>"}, {"kicker": "2. 글자 학습", "title": "2. 글자 학습", "kind": "topic", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/007_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "교재, 한글 글자블럭, 미니레고판을 준비해주세요."}], "displayName": "05 2. 글자 학습"}, {"kicker": "2. 글자 학습", "title": "<‘모’ 를 배워요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘모’ 를 배워요>"}, {"type": "text", "text": "‘ㅁ’ 과 ‘ㅗ’ 가 만나면 글자 ‘모’ 가 돼요. 우리 친구들도 글자 ‘모’ 를 만들어 볼까요? 교재 14p을 펼쳐요. 위쪽에 ‘ㅁ’ 블럭을, 아래쪽에 ‘ㅗ’ 블럭을 올려 놓아요. ‘ㅁ’ 블럭과 ‘ㅗ’ 블럭을 가운데로 모아서 글자 ‘모’ 를 완성해요. 그림의 단어를 말하면서 블럭 글자를 잘 보고, ‘모’ 를 만들어 보세요. → 그림을 보고 어떤 단어일지 말해보세요. → 모자의 ‘모’. 따라 말해보세요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/004_4607266a_교구활동1_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/008_d2a1a663_모모모모음.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/009_528a61e7_모자.jpg"]}], "displayName": "06 <‘모’ 를 배워요>"}, {"kicker": "2. 글자 학습", "title": "<‘모’ 가 들어간 단어>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘모’ 가 들어간 단어>"}, {"type": "text", "text": "4장의 단어 카드가 있어요. 그림과 단어를 잘 보고, 문제를 풀어보세요. 교재 15p의 단어를 여러 번 읽어보세요. → 리모컨의 ‘모’. 따라 말해보세요. → 코스모스의 ‘모’. 따라 말해보세요. 미니레고판에 글자블럭으로 단어를 만들어 보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/010_e84ecb3f_19차시-퀴즈.jpg"}], "displayName": "07 <‘모’ 가 들어간 단어>"}, {"kicker": "2. 글자 학습", "title": "<‘무’ 를 배워요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘무’ 를 배워요>"}, {"type": "text", "text": "‘ㅁ’ 과 ‘ㅜ’ 가 만나면 글자 ‘무’ 가 돼요. 우리 친구들도 글자 ‘무’ 를 만들어 볼까요? 교재 16p을 펼쳐요. 위쪽에 ‘ㅁ’블럭을, 아래쪽에 ‘ㅜ’블럭을 올려 놓아요. ‘ㅁ’ 블럭과 ‘ㅜ’ 블럭을 가운데로 모아서 글자 ‘무’ 를 완성해요. 그림의 단어를 말하면서 블럭 글자를 잘 보고, ‘무’ 를 만들어 보세요. → 그림을 보고 어떤 단어일지 말해보세요. → 나무의 ‘무’. 따라 말해보세요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/005_6ad8c47e_교구활동2_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/011_a2eee498_무무무무무.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/012_32fcfc3c_나무.jpg"]}], "displayName": "08 <‘무’ 를 배워요>"}, {"kicker": "2. 글자 학습", "title": "<‘무’ 가 들어간 단어>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘무’ 가 들어간 단어>"}, {"type": "text", "text": "4장의 단어 카드가 있어요. 그림과 단어를 잘 보고, 문제를 풀어보세요. 교재 17p의 단어를 여러 번 읽어보세요. → 무궁화의 ‘무’. 따라 말해보세요. → 줄무늬의 ‘무’. 따라 말해보세요. 미니레고판에 글자블럭으로 단어를 만들어 보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/013_0d73d6f9_19차시-퀴즈-2.jpg"}], "displayName": "09 <‘무’ 가 들어간 단어>"}, {"kicker": "2. 글자 학습", "title": "<‘므’ 를 배워요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘므’ 를 배워요>"}, {"type": "text", "text": "‘ㅁ’과 ‘ㅡ’가 만나면 글자 ‘므’가 돼요. 우리 친구들도 글자 ‘므’ 를 만들어 볼까요? 교재 18p을 펼쳐요. 위쪽에 ‘ㅁ’ 블럭을, 아래쪽에 ‘ㅡ’블럭을 올려 놓아요. ‘ㅁ’ 블럭과 ‘ㅡ’ 블럭을 가운데로 모아서 글자 ‘므’ 를 완성해요. 그림의 단어를 말하면서 블럭 글자를 잘 보고, ‘므’ 를 만들어 보세요. → 그림을 보고 어떤 단어일지 말해보세요. → 오므리다의 ‘므’. 따라 말해보세요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/014_38bf1fdc_교구활동3_수정.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/015_d961bfce_므므므므므.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/016_13baf814_오므리다.jpg"]}], "displayName": "10 <‘므’ 를 배워요>"}, {"kicker": "2. 글자 학습", "title": "<‘므’ 가 들어간 단어>", "kind": "topic", "blocks": [{"type": "heading", "text": "<‘므’ 가 들어간 단어>"}, {"type": "text", "text": "4장의 단어 카드가 있어요. 그림과 단어를 잘 보고, 문제를 풀어보세요. 교재 19p의 단어를 여러 번 읽어보세요. → 오므라이스의 ‘므’. 따라 말해보세요. → 그러므로의 ‘므’. 따라 말해보세요. 미니레고판에 글자블럭으로 단어를 만들어 보세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/017_d36f0289_19차시-퀴즈-3번.jpg"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2206", "title": "인터랙티브 #2206"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2207", "title": "인터랙티브 #2207"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2208", "title": "인터랙티브 #2208"}], "displayName": "11 <‘므’ 가 들어간 단어>"}, {"kicker": "3. 글자 블럭 게임", "title": "3. 글자 블럭 게임", "kind": "topic", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/007_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "교재, 한글 글자블럭, 미니레고판, 스티커, 색연필을 준비해주세요."}], "displayName": "12 3. 글자 블럭 게임"}, {"kicker": "3. 글자 블럭 게임", "title": "<게임 방법을 이해해요>", "kind": "topic", "blocks": [{"type": "heading", "text": "<게임 방법을 이해해요>"}, {"type": "text", "text": "교재 20p를 펼쳐 보세요. 글자퀴즈의 답을 맞히면, 교재에 스티커를 붙여서 글자의 힘을 모을 수 있어요. <연습 게임> 이번 게임은 공통으로 들어갈 글자를 알아내고 블럭으로 글자를 만드는 게임이에요. 연습 게임을 해볼까요?"}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/018_4f7f50d7_게임활동1_수정-e1667367856630.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/019_8e7c87f7_플라팜_5호p20.jpg", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/020_4c9140f6_스티커1.jpg"]}, {"type": "text", "text": "아래 단어를 보세요. 두 단어에서 공통으로 들어갈 글자가 비어있어요. 글자블럭을 사용해서 ‘?’에 들어갈 글자를 미니레고판에 만들어보세요. 아이들이 미니레고판을 머리 위로 들면, 선생님이 정답을 말해줘요. → 정답은 바로 ‘모’ 예요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/021_ed82d6f6_퍼즐퀴즈.jpg"}, {"type": "text", "text": "정답을 맞힌 친구는, ‘모’ 스티커를 떼서 교재에 붙이세요."}], "displayName": "13 <게임 방법을 이해해요>"}, {"kicker": "3. 글자 블럭 게임", "title": "<본 게임>", "kind": "topic", "blocks": [{"type": "heading", "text": "<본 게임>"}, {"type": "text", "text": "본격적으로 게임을 진행해요. 글자블럭을 사용해서 ‘?’에 들어갈 글자를 미니레고판에 만들어보세요. 답변을 입력하지 않고 ‘화살표’만 눌러도 다음 문제로 넘길 수 있어요."}, {"type": "text", "text": "게임을 마친 후, 획득한 글자 스티커의 개수를 교재에 적어요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2019", "title": "인터랙티브 #2019"}], "displayName": "14 <본 게임>"}, {"kicker": "4. 수업 마무리", "title": "4. 수업 마무리", "kind": "quiz", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/022_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": "오늘은 자음 ‘ㅁ’ 과 모음 ‘ㅗ, ㅜ, ㅡ’ 가 만난 글자인 ‘모, 무, 므’ 를 배웠어요,. 글자블럭으로 단어도 만들고, 글자의 힘을 되찾기 위한 공통 글자 찾기 게임도 해보았어요."}, {"type": "text", "text": "오늘 수업에 대한 친구들의 생각을 말해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배워요/assets/images/023_c448dddf_크기변환자산-23.jpg"}, {"type": "quiz", "question": "오늘 수업은 즐거웠나요?", "options": ["네", "아니요"]}, {"type": "quiz", "question": "오늘 활동의 난이도는 어땠나요?", "options": ["쉬웠어요.", "보통이에요.", "어려웠어요."]}, {"type": "quiz", "question": "어떤 활동이 재미있었나요?", "options": ["블럭으로 단어 만들기", "글자의 힘을 되찾는 퀴즈 놀이"]}], "displayName": "15 4. 수업 마무리"}], "stages": [{"label": "차시 안내", "displayName": "01 차시 안내", "type": "intro", "title": "19차시. 모, 무, 므를 배워요", "bubble": "[플라팜] 한글 글자블럭, 미니레고판, 6세 5호 교재", "teacherTalk": "오늘 수업 목표와 준비물을 안내하세요.", "resources": [], "image": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/19차시-모-무-므를-배     let index = 0;
    let sourcePages = [];
    let pages = [];
    let reflowTimer = null;
    let reflowing = false;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = "blk-heading";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = "blk-text";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-image" + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = "blk-gallery";
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-h5p";
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

    async function reflowPages() {
      if (reflowing) return;
      reflowing = true;
      const keepId = (pages[index] && (pages[index].displayName || pages[index].title)) || "";
      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
      } finally {
        reflowing = false;
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n왼쪽 클릭=이전, 오른쪽 클릭=다음`
        : "왼쪽 클릭=이전, 오른쪽 클릭=다음";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
</body>
</html>
