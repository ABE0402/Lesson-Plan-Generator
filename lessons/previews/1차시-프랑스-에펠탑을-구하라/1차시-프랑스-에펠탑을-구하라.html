<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1100px, calc(100% - 16px));
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      padding: 8px 0 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden; /* 스크롤 금지 — 넘치면 페이지 분할 */
      padding: 20px 22px 24px;
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.15rem, 2.2vw, 1.55rem);
      line-height: 1.35;
    }
    .blocks { display: flex; flex-direction: column; gap: 12px; }
    .blk-heading {
      margin: 6px 0 0;
      font-size: 1.05rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
    }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 440px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-image.tight img { max-height: min(32dvh, 320px); }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }
    .blk-gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .blk-h5p iframe {
      width: 100%;
      min-height: min(48dvh, 520px);
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    /* 좌우 클릭 이동 영역 */
    .nav-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      z-index: 6;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .nav-hit.prev { left: 0; cursor: w-resize; }
    .nav-hit.next { right: 0; cursor: e-resize; }
    .nav-hit:disabled { cursor: default; }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    @media (max-width: 720px) {
      .page-scroll { padding: 16px 14px 20px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-hit { width: 24%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="page-scroll" id="scroll">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
      <button type="button" class="nav-hit prev" id="hitPrev" aria-label="이전 페이지"></button>
      <button type="button" class="nav-hit next" id="hitNext" aria-label="다음 페이지"></button>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">화면 왼쪽을 누르면 이전, 오른쪽을 누르면 다음 페이지입니다.</p>
      </div>
    </div>
  </div>

  <script>
    let lessonData = {"mode": "blocks", "level": "만들면서 배우는 세계문화 이야기", "title": "1차시. 프랑스, 에펠탑을 구하라!", "sourceUrl": "https://crayonschool.co.kr/lessons/1%ec%b0%a8%ec%8b%9c-%ed%94%84%eb%9e%91%ec%8a%a4-%ec%97%90%ed%8e%a0%ed%83%91%ec%9d%84-%ea%b5%ac%ed%95%98%eb%9d%bc/", "expression": "", "characterImages": {"intro": "", "thinking": "", "guide": ""}, "goals": ["「1. 탐색하기」로 개념을 탐색한다.", "인터랙티브 영상으로 퍼즐미션에 도전한다.", "「3. 연계 활동」에서 배운 내용을 응용·놀이한다.", "오늘 수업을 회상하고 생각을 나눈다."], "materials": [], "pages": [{"kicker": "차시 안내", "title": "1차시. 프랑스, 에펠탑을 구하라!", "kind": "lesson", "blocks": [{"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/001_c88c0334_스크린샷-2025-07-18-000001.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/002_0d636d15_아지틴즈-1.jpeg"]}, {"type": "text", "text": "스콜 라스 세계 랜드마크 시리즈 – 에펠탑 아지틴즈(AGITeens) – 어린이 GPT / 청소년 GPT(연계활동시 사용/필수 X)"}, {"type": "text", "text": "세계 다양한 도시의 문화와 역사 등에 대해 배워봐요. 세계 랜드마크와 그에 관한 이야기를 배워봐요."}], "displayName": "01 1차시. 프랑스, 에펠탑을 구하라!"}, {"kicker": "1. 탐색하기", "title": "<만들면서 배우는 세계문화 이야기>", "kind": "topic", "blocks": [{"type": "heading", "text": "<만들면서 배우는 세계문화 이야기>"}, {"type": "text", "text": "첫 번째 수업에 온 친구들 환영해요! 오늘은 예술과 낭만의 도시, 프랑스 파리 로 떠나볼 거예요. 높이 솟은 에펠탑과 달콤한 마카롱이 기다리고 있는 파리에는 어떤 멋진 이야기들이 숨겨져 있을까요? 우리 함께 파리로 여행을 떠나볼까요?"}, {"type": "text", "text": "친구들은 프랑스라는 나라에 대해 알고 있나요?"}, {"type": "text", "text": "프랑스는 어떤 게 유명할까요?"}, {"type": "text", "text": "에펠탑의 이름은 어떤 의미일까요?"}, {"type": "text", "text": "프랑스는 어떤 국가일까요?"}, {"type": "divider"}, {"type": "text", "text": "맞아요! 에펠탑 은 단순한 철탑이 아니라, 파리의 상징이자 세계에서 가장 유명한 건축물 중 하나예요. 1889년 세계 박람회를 기념해 만들어졌고, 그 당시에는 ‘너무 이상하다’는 반응도 많았지만, 지금은 모두가 사랑하는 파리의 대표 명소가 되었죠!"}, {"type": "text", "text": "밤이 되면 황금빛 조명이 켜지고, 정각이 되면 반짝이는 불빛이 마치 별처럼 에펠탑을 감싸요. 많은 영화, 드라마, 애니메이션 속에서 등장하고, 사랑을 고백하는 장소로도 유명하답니다. 매년 수많은 사람들이 에펠탑 앞에서 사진을 찍고, 아름다운 파리의 야경을 즐기러 찾아와요."}, {"type": "text", "text": "이제 우리도 파리의 상징, 에펠탑 앞으로 함께 떠나볼까요?"}], "displayName": "02 <만들면서 배우는 세계문화 이야기>"}, {"kicker": "2. 영상 학습", "title": "만들면서 배우는 세계문화 이야기", "kind": "topic", "blocks": [{"type": "heading", "text": "만들면서 배우는 세계문화 이야기"}, {"type": "text", "text": "1차시. 프랑스, 에펠탑을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "1. 탐색하기"}, {"type": "text", "text": "2. 영상 학습"}, {"type": "text", "text": "3. 연계 활동"}, {"type": "text", "text": "4. 수업 마무리"}, {"type": "text", "text": "2차시. 호주, 시드니 오페라를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "3차시. 영국, 빅벤을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "4차시. 미국, 자유의 여신상을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "5차시 중국, 만리장성을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "6차시. 인도, 타지마할을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "7차시. 이탈리아, 콜로세움을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "8차시. 대한민국, 경복궁을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "9차시. 이집트, 피라미드 & 스핑크스를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "10차시. 러시아, 성 바실리 대성당을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "11차시. 아랍 에미리트, 버즈 알 아랍을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "12차시. 그리스, 아크로폴리스를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "13차시. 튀르키예, 술탄 아흐메트 모스크를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "14차시. 캄보디아, 앙코르와트를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "15차시. 칠레, 모아이 석상을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "16차시. 브라질, 리오 예수상을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "17차시. 스페인, 사그라다 파밀리아 성당을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "18차시. 네덜란드, 풍차를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "19차시. 페루, 마추픽추를 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "20차시. 일본, 오사카 성을 구하라! 3 주제 | 1 퀴즈 1. 탐색하기 2. 영상 학습 3. 연계 활동 4. 수업 마무리"}, {"type": "text", "text": "1차시. 프랑스, 에펠탑을 구하라!"}, {"type": "text", "text": "준비된 친구들은 아래 영상을 플레이 해주세요."}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2465", "title": "인터랙티브 #2465"}], "displayName": "03 만들면서 배우는 세계문화 이야기"}, {"kicker": "3. 연계 활동", "title": "3. 연계 활동", "kind": "topic", "blocks": [{"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/003_9cf36aea_활동하기_수정.jpg"}, {"type": "text", "text": "스콜라스 세계 랜드마크 시리즈 ‘에펠탑’ 을 준비해주세요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/004_7d039118_9HsBpngW-연계활동1_수정.jpg"}, {"type": "text", "text": "지금까지 배웠던 것들에 대해 복습해요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/005_c1957f57_연계활동2_수정.jpg"}], "displayName": "04 3. 연계 활동"}, {"kicker": "3. 연계 활동", "title": "<프랑스 파리 에펠탑>", "kind": "topic", "blocks": [{"type": "heading", "text": "<프랑스 파리 에펠탑>"}, {"type": "text", "text": "교구를 열어봐요."}, {"type": "text", "text": "교구를 열어 <프랑스 파리 에펠탑>을 조립해봐요."}, {"type": "text", "text": "교구를 조립하며 에펠탑이 어떻게 생겼는지 자세히 들여다봐요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/006_76cc5edf_ocjHfZSf-연계활동3_수정.jpg"}, {"type": "text", "text": "아지틴즈와 프랑스, 파리 에펠탑에 대해 이야기 나눠봐요."}, {"type": "gallery", "srcs": ["https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/007_c763f434_아지틴즈-바로가기-1024x184.png", "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/002_0d636d15_아지틴즈-1.jpeg"]}, {"type": "text", "text": "아지틴즈와 오늘 배운 내용에 대해 이야기 나누기."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/008_27e1cbe3_스크린샷-2026-02-25-174647-1024x551.png"}, {"type": "text", "text": "▶ 프랑스에 있는 유명한 박물관인 루브르 박물관에서 유명한 작품으로는 뭐가 있을까?"}, {"type": "text", "text": "▶ 에펠탑은 어떤 재료로 만들어졌을까?"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2406", "title": "인터랙티브 #2406"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2407", "title": "인터랙티브 #2407"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2408", "title": "인터랙티브 #2408"}, {"type": "h5p", "src": "https://crayonschool.co.kr/wp-admin/admin-ajax.php?action=h5p_embed&id=2498", "title": "인터랙티브 #2498"}], "displayName": "05 <프랑스 파리 에펠탑>"}, {"kicker": "4. 수업 마무리", "title": "4. 수업 마무리", "kind": "quiz", "blocks": [{"type": "text", "text": "오늘 우리는 미식과 예술의 나라 프랑스 로 떠나봤어요. 프랑스의 문화와 역사, 명물들부터 인삿말까지 배워봤죠. 또한 프랑스의 랜드마크인 에펠탑 이 지니고 있는 가치 와 이야기 에 대해서도 배워봤어요. 프랑스의 아주 중요한 랜드마크였어요."}, {"type": "image", "src": "https://raw.githubusercontent.com/ABE0402/Lesson-Plan-Generator/cursor/batch-gyoan-previews-0db1/lessons/previews/1차시-프랑스-에펠탑을-구하라/assets/images/009_aaba6d51_활동을정리해요_파랑.jpg"}, {"type": "text", "text": "여러분은 오늘 배운 것 중 어떤 게 가장 기억에 남나요? 이렇게 집에서 떠나본 프랑스 여행은 즐거웠나요? 여러분들이 즐거운 여행을 통해 프랑스와 에펠탑의 가치 와 역사 에 대해 알     let index = 0;

    function loadSourcePages(data) {
      if (data.pages && data.pages.length) return JSON.parse(JSON.stringify(data.pages));
      return legacyFromStages(data);
    }

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({
          kicker: s.displayName || s.label,
          title: s.title || s.label,
          blocks,
        });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlocks(blocks, tight) {
      const root = document.getElementById("blocks");
      root.innerHTML = "";
      (blocks || []).forEach((b) => {
        const t = b.type;
        if (t === "heading") {
          const el = document.createElement("h2");
          el.className = "blk-heading";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "text") {
          const el = document.createElement("p");
          el.className = "blk-text";
          el.textContent = b.text || "";
          root.appendChild(el);
        } else if (t === "image" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-image" + (tight ? " tight" : "");
          wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
          root.appendChild(wrap);
        } else if (t === "gallery" && b.srcs && b.srcs.length) {
          const wrap = document.createElement("div");
          wrap.className = "blk-gallery";
          wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
          root.appendChild(wrap);
        } else if (t === "h5p" && b.src) {
          const wrap = document.createElement("div");
          wrap.className = "blk-h5p";
          wrap.innerHTML = `
            <div class="label">${esc(b.title || "인터랙티브")}</div>
            <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
          root.appendChild(wrap);
        } else if (t === "divider") {
          const el = document.createElement("div");
          el.className = "blk-divider";
          root.appendChild(el);
        } else if (t === "quiz") {
          const wrap = document.createElement("div");
          wrap.className = "quiz";
          const opts = (b.options || []).map((o, i) =>
            `<button type="button" data-i="${i}">${esc(o)}</button>`
          ).join("");
          wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
          wrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
              btn.classList.add("on");
            });
          });
          root.appendChild(wrap);
        }
      });
    }

    function overflows() {
      const el = document.getElementById("scroll");
      return el.scrollHeight > el.clientHeight + 2;
    }

    function waitImages(root) {
      const imgs = Array.from(root.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        imgs.map((img) => {
          if (img.complete && img.naturalWidth) return Promise.resolve();
          return new Promise((resolve) => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
            setTimeout(done, 2500);
          });
        })
      );
    }

    function probe(srcPage, blocks, tight) {
      document.getElementById("kicker").textContent = srcPage.kicker || srcPage.displayName || "";
      document.getElementById("heading").textContent = srcPage.title || "";
      renderBlocks(blocks, tight);
    }

    async function packSourcePage(srcPage) {
      const queue = [...(srcPage.blocks || [])];
      const out = [];
      if (!queue.length) {
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: [],
        });
        return out;
      }

      while (queue.length) {
        const chunk = [];
        while (queue.length) {
          chunk.push(queue[0]);
          probe(srcPage, chunk, false);
          await waitImages(document.getElementById("blocks"));
          if (overflows()) {
            chunk.pop();
            if (!chunk.length) {
              // 한 블록이 화면보다 큼 → 단독 페이지 + 타이트 이미지
              chunk.push(queue.shift());
              probe(srcPage, chunk, true);
              await waitImages(document.getElementById("blocks"));
            }
            break;
          }
          queue.shift();
        }
        out.push({
          kicker: srcPage.kicker,
          title: srcPage.title,
          displayName: srcPage.displayName,
          kind: srcPage.kind,
          blocks: chunk.slice(),
        });
      }
      return out;
    }

      try {
        const fitted = [];
        for (const src of sourcePages) {
          const parts = await packSourcePage(src);
          fitted.push(...parts);
        }
        // 연속 분할된 같은 원본 페이지에 번호 보강
        let n = 0;
        pages = fitted.map((p) => {
          n += 1;
          return {
            ...p,
            displayName: p.displayName || `${String(n).padStart(2, "0")} ${p.title || ""}`,
          };
        });
        if (!pages.length) {
          pages = [{ kicker: "", title: lessonData.title || "", blocks: [] }];
        }
        // 이전 위치 유지 시도
        let next = index;
        if (keepId) {
          const found = pages.findIndex(
            (p) => p.displayName === keepId || p.title === keepId
          );
          if (found >= 0) next = found;
        }
        index = Math.max(0, Math.min(next, pages.length - 1));
        render();
      } finally {
        reflowing = false;
      }
    }

    function scheduleReflow() {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => reflowPages(), 120);
    }

    function notifyParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "crayon-page-change", pageIndex: index }, "*");
        }
      } catch (_e) { /* ignore */ }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function render() {
      const page = pages[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${pages.length}`;
      document.getElementById("hitPrev").disabled = index <= 0;
      document.getElementById("hitNext").disabled = index >= pages.length - 1;
      const tip = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n왼쪽 클릭=이전, 오른쪽 클릭=다음`
        : "왼쪽 클릭=이전, 오른쪽 클릭=다음";
      document.getElementById("teacherText").textContent = tip;
      renderBlocks(page.blocks || [], false);
      notifyParent();
    }

    function applyLessonUpdate(payload) {
      if (payload && payload.lesson) {
        lessonData = payload.lesson;
        sourcePages = loadSourcePages(lessonData);
      }
      if (payload && typeof payload.pageIndex === "number") {
        index = Math.max(0, payload.pageIndex);
      }
      scheduleReflow();
    }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "crayon-lesson-update") return;
      applyLessonUpdate(e.data);
    });

    document.getElementById("hitPrev").onclick = () => go(-1);
    document.getElementById("hitNext").onclick = () => go(1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    window.addEventListener("resize", scheduleReflow);

    sourcePages = loadSourcePages(lessonData);
    pages = sourcePages.slice();
    render();
    reflowPages();
  </script>
</body>
</html>
