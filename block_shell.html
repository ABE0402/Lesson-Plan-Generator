<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
      --gap: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1100px, calc(100% - 16px));
      height: 100dvh;
      margin: 0 auto;
      padding: 8px 0 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 16px;
      background: rgba(255,253,248,0.88);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 800; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ghost {
      border-radius: 999px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.8rem;
    }

    .stage {
      min-height: 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.94);
      box-shadow: 0 10px 30px rgba(60,40,20,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 스크롤 금지 — 넘치면 페이지 분할 */
    .page-pane {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kicker {
      color: var(--accent-deep);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      line-height: 1.35;
      flex: 0 0 auto;
    }
    .blocks {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-height: 0;
      overflow: hidden;
    }
    .blk-heading {
      margin: 0;
      font-size: 1.02rem;
      color: var(--sky);
      font-weight: 800;
    }
    .blk-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .blk-image, .blk-gallery {
      border-radius: 14px;
      overflow: hidden;
      background: #f7f1e8;
      border: 1px solid var(--line);
      flex: 0 1 auto;
      min-height: 0;
    }
    .blk-image img {
      width: 100%;
      max-height: min(42dvh, 380px);
      object-fit: contain;
      margin: 0 auto;
      background: #fff;
    }
    .blk-gallery {
      display: grid;
      gap: 8px;
      padding: 8px;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      align-content: center;
    }
    .blk-gallery img {
      width: 100%;
      max-height: min(28dvh, 220px);
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .blk-h5p {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .blk-h5p .label {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      flex: 0 0 auto;
    }
    .blk-h5p iframe {
      width: 100%;
      flex: 1 1 auto;
      min-height: min(58dvh, 560px);
      border: 0;
      display: block;
      background: #fff;
    }
    .blk-divider {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }
    .quiz {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .quiz h3 { margin: 0 0 10px; font-size: 1rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: #faf6ef;
    }
    .opts button.on { background: #ffe8d2; border-color: var(--accent); }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 2px;
    }
    .nav-btn {
      border-radius: 999px;
      padding: 10px 16px;
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 700;
    }
    .nav-btn.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-deep));
      color: #fff;
      border-color: transparent;
    }
    .dots {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 50%;
      max-height: 28px;
      overflow: hidden;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #d2c6b6;
    }
    .dot.on { background: var(--accent); transform: scale(1.25); }

    .teacher {
      position: fixed; inset: 0; background: rgba(20,16,12,0.35);
      display: grid; place-items: end center; padding: 16px; z-index: 20;
    }
    .teacher .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--line);
    }
    .teacher h2 { margin: 0; font-size: 1rem; }
    .teacher p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; }

    #measureHost {
      position: absolute;
      left: -99999px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .page-pane { padding: 14px 14px 16px; }
      .blk-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dots { display: none; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <div class="brand" id="lessonTitle">크레용 디지털 교안</div>
        <div class="meta" id="lessonLevel"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사 팁</button>
      </div>
    </header>

    <section class="stage">
      <div class="page-pane" id="pane">
        <div class="kicker" id="kicker"></div>
        <h1 id="heading"></h1>
        <div class="blocks" id="blocks"></div>
      </div>
    </section>

    <div class="teacher" id="teacher" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h2>교사용</h2>
          <button class="ghost" id="closeTeacher" type="button">닫기</button>
        </div>
        <p id="teacherText">화면은 스크롤하지 않습니다. 내용이 길면 다음 장으로 이어집니다.</p>
      </div>
    </div>

    <footer class="bottom">
      <button class="nav-btn" id="prevBtn" type="button">← 이전</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn primary" id="nextBtn" type="button">다음 →</button>
    </footer>
  </div>
  <div id="measureHost"></div>

  <script>
    const lessonData = __LESSON_DATA__;
    let index = 0;
    let slides = [];

    const sourcePages = (lessonData.pages && lessonData.pages.length)
      ? lessonData.pages
      : legacyFromStages(lessonData);

    function legacyFromStages(data) {
      const out = [];
      (data.stages || []).forEach((s) => {
        const blocks = [];
        if (s.bubble) blocks.push({ type: "text", text: s.bubble });
        if (s.image) blocks.push({ type: "image", src: s.image });
        (s.images || []).forEach((src) => blocks.push({ type: "image", src }));
        if (s.videoUrl) blocks.push({ type: "h5p", src: s.videoUrl, title: s.title || "영상" });
        (s.discussionPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.playPages || []).forEach((p) => {
          if (p.title) blocks.push({ type: "heading", text: p.title });
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          (p.steps || []).forEach((t) => blocks.push({ type: "text", text: t }));
          if (p.image) blocks.push({ type: "image", src: p.image });
        });
        (s.closingPages || []).forEach((p) => {
          if (p.bubble) blocks.push({ type: "text", text: p.bubble });
          if (p.quiz) blocks.push({ type: "quiz", question: p.quiz.question, options: p.quiz.options || [] });
        });
        out.push({ kicker: s.displayName || s.label, title: s.title || s.label, blocks });
      });
      return out;
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function expandBlocks(blocks) {
      /* gallery가 크면 장당 이미지 수를 줄여 넘침을 줄임 */
      const out = [];
      (blocks || []).forEach((b) => {
        if (b.type === "gallery" && b.srcs && b.srcs.length > 4) {
          for (let i = 0; i < b.srcs.length; i += 4) {
            const slice = b.srcs.slice(i, i + 4);
            out.push(slice.length === 1
              ? { type: "image", src: slice[0] }
              : { type: "gallery", srcs: slice });
          }
        } else if (b.type === "h5p") {
          out.push(b);
        } else {
          out.push(b);
        }
      });
      return out;
    }

    function appendBlockEl(root, b) {
      const t = b.type;
      if (t === "heading") {
        const el = document.createElement("h2");
        el.className = "blk-heading";
        el.textContent = b.text || "";
        root.appendChild(el);
      } else if (t === "text") {
        const el = document.createElement("p");
        el.className = "blk-text";
        el.textContent = b.text || "";
        root.appendChild(el);
      } else if (t === "image" && b.src) {
        const wrap = document.createElement("div");
        wrap.className = "blk-image";
        wrap.innerHTML = `<img src="${esc(b.src)}" alt="">`;
        root.appendChild(wrap);
      } else if (t === "gallery" && b.srcs && b.srcs.length) {
        const wrap = document.createElement("div");
        wrap.className = "blk-gallery";
        wrap.innerHTML = b.srcs.map((src) => `<img src="${esc(src)}" alt="">`).join("");
        root.appendChild(wrap);
      } else if (t === "h5p" && b.src) {
        const wrap = document.createElement("div");
        wrap.className = "blk-h5p";
        wrap.innerHTML = `
          <div class="label">${esc(b.title || "인터랙티브")}</div>
          <iframe src="${esc(b.src)}" allowfullscreen title="${esc(b.title || "H5P")}"></iframe>`;
        root.appendChild(wrap);
      } else if (t === "divider") {
        const el = document.createElement("div");
        el.className = "blk-divider";
        root.appendChild(el);
      } else if (t === "quiz") {
        const wrap = document.createElement("div");
        wrap.className = "quiz";
        const opts = (b.options || []).map((o, i) =>
          `<button type="button" data-i="${i}">${esc(o)}</button>`
        ).join("");
        wrap.innerHTML = `<h3>${esc(b.question || "질문")}</h3><div class="opts">${opts}</div>`;
        wrap.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            wrap.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
            btn.classList.add("on");
          });
        });
        root.appendChild(wrap);
      }
    }

    function renderBlocksInto(root, blocks) {
      root.innerHTML = "";
      (blocks || []).forEach((b) => appendBlockEl(root, b));
    }

    function waitImages(root) {
      const imgs = [...root.querySelectorAll("img")];
      if (!imgs.length) return Promise.resolve();
      return Promise.all(imgs.map((img) => {
        if (img.complete) return Promise.resolve();
        return new Promise((res) => {
          img.onload = img.onerror = () => res();
        });
      }));
    }

    async function fits(meta, blocks, budgetH, budgetW) {
      const host = document.getElementById("measureHost");
      host.innerHTML = "";
      const pane = document.createElement("div");
      pane.className = "page-pane";
      pane.style.width = budgetW + "px";
      pane.style.height = budgetH + "px";
      pane.style.overflow = "hidden";
      pane.innerHTML = `
        <div class="kicker"></div>
        <h1></h1>
        <div class="blocks"></div>`;
      pane.querySelector(".kicker").textContent = meta.kicker || "";
      pane.querySelector("h1").textContent = meta.title || "";
      const blocksEl = pane.querySelector(".blocks");
      renderBlocksInto(blocksEl, blocks);
      host.appendChild(pane);
      await waitImages(pane);
      const overflow = pane.scrollHeight > pane.clientHeight + 2
        || blocksEl.scrollHeight + pane.querySelector("h1").offsetHeight
          + pane.querySelector(".kicker").offsetHeight + 24 > budgetH + 2;
      /* scrollHeight on overflow:hidden still reports content size */
      const contentH = pane.scrollHeight;
      host.innerHTML = "";
      return contentH <= budgetH + 1;
    }

    async function paginate() {
      const pane = document.getElementById("pane");
      const budgetH = pane.clientHeight;
      const budgetW = pane.clientWidth;
      const out = [];

      for (const page of sourcePages) {
        const meta = {
          kicker: page.kicker || page.displayName || "",
          title: page.title || "",
        };
        const blocks = expandBlocks(page.blocks || []);
        if (!blocks.length) {
          out.push({ ...meta, blocks: [] });
          continue;
        }

        let chunk = [];
        for (const block of blocks) {
          /* H5P는 단독 페이지 */
          if (block.type === "h5p") {
            if (chunk.length) {
              out.push({ ...meta, blocks: chunk });
              chunk = [];
            }
            out.push({ ...meta, title: block.title || meta.title, blocks: [block] });
            continue;
          }

          const trial = chunk.concat([block]);
          if (await fits(meta, trial, budgetH, budgetW)) {
            chunk = trial;
            continue;
          }
          if (chunk.length) {
            out.push({ ...meta, blocks: chunk });
            chunk = [];
          }
          /* 한 블록이 화면보다 커도 한 장에 넣고(이미지 contain), 텍스트면 강제로 한 장 */
          if (block.type === "gallery" && block.srcs && block.srcs.length > 1) {
            for (const src of block.srcs) {
              out.push({ ...meta, blocks: [{ type: "image", src }] });
            }
          } else {
            chunk = [block];
            if (!(await fits(meta, chunk, budgetH, budgetW))) {
              out.push({ ...meta, blocks: chunk });
              chunk = [];
            }
          }
        }
        if (chunk.length) out.push({ ...meta, blocks: chunk });
      }

      slides = out.map((s, i) => ({
        ...s,
        displayName: `${String(i + 1).padStart(2, "0")} ${s.title || s.kicker || "화면"}`,
      }));
      if (!slides.length) slides = [{ kicker: "", title: "내용 없음", blocks: [] }];
    }

    function render() {
      const page = slides[index] || { title: "", blocks: [] };
      document.getElementById("lessonTitle").textContent = lessonData.title || "크레용 디지털 교안";
      document.getElementById("lessonLevel").textContent = lessonData.level || "";
      document.getElementById("kicker").textContent = page.kicker || page.displayName || "";
      document.getElementById("heading").textContent = page.title || "";
      document.getElementById("pagePill").textContent = `${index + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = index <= 0;
      document.getElementById("nextBtn").disabled = index >= slides.length - 1;
      document.getElementById("teacherText").textContent = lessonData.sourceUrl
        ? `원본: ${lessonData.sourceUrl}\n화면은 스크롤되지 않습니다. 길면 다음 장으로 이어집니다.`
        : "화면은 스크롤되지 않습니다. 길면 다음 장으로 이어집니다.";
      renderBlocksInto(document.getElementById("blocks"), page.blocks || []);
      document.getElementById("dots").innerHTML = slides.map((_, i) =>
        `<span class="dot${i === index ? " on" : ""}"></span>`
      ).join("");
    }

    async function rebuild(keepRatio) {
      const ratio = slides.length ? index / Math.max(slides.length - 1, 1) : 0;
      await paginate();
      if (keepRatio) index = Math.min(slides.length - 1, Math.round(ratio * (slides.length - 1)));
      else index = Math.min(index, slides.length - 1);
      render();
    }

    document.getElementById("prevBtn").onclick = () => {
      if (index > 0) { index -= 1; render(); }
    };
    document.getElementById("nextBtn").onclick = () => {
      if (index < slides.length - 1) { index += 1; render(); }
    };
    document.getElementById("teacherBtn").onclick = () => {
      document.getElementById("teacher").hidden = false;
    };
    document.getElementById("closeTeacher").onclick = () => {
      document.getElementById("teacher").hidden = true;
    };
    document.getElementById("teacher").addEventListener("click", (e) => {
      if (e.target.id === "teacher") e.currentTarget.hidden = true;
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => rebuild(true), 200);
    });

    rebuild(false);
  </script>
</body>
</html>
