<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>크레용 디지털 교안</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #5c6570;
      --line: #e4ddd2;
      --sand: #f3ebe0;
      --paper: #fffdf8;
      --accent: #e07a2f;
      --accent-deep: #c45f16;
      --sky: #3a7ca5;
      --ok: #2f7d4a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #ffe4c4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #d9eef6 0%, transparent 50%),
        linear-gradient(180deg, #faf6ef 0%, #ebe2d4 100%);
      overflow: hidden;
    }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    img { display: block; max-width: 100%; }
    [hidden] { display: none !important; }

    .frame {
      width: min(1280px, calc(100% - 16px));
      height: 100dvh;
      margin: 0 auto;
      padding: 8px 0 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 18px;
      background: rgba(255,253,248,0.92);
    }
    .top h1 {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .top .meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .pill {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffe8d2;
      color: var(--accent-deep);
      font-size: 0.85rem;
      font-weight: 800;
    }
    .ghost {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--sand);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .stage {
      position: relative;
      min-height: 0;
      border: 5px solid rgba(255,255,255,0.9);
      border-radius: 24px;
      background: var(--paper);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(31, 36, 48, 0.1);
    }
    .tap {
      position: absolute;
      top: 0; bottom: 0;
      width: 18%;
      z-index: 5;
      background: transparent;
    }
    .tap.prev { left: 0; }
    .tap.next { right: 0; }

    #pageRoot {
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .page {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .page-stack {
      width: min(100%, 920px);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: clamp(10px, 1.6vw, 16px);
      padding: clamp(12px, 2vw, 22px) clamp(16px, 3vw, 36px);
      overflow: hidden;
    }

    /* 이미지: 비율 유지 + 뷰포트 안에 맞춤 (스크롤 없음) */
    .media-gallery {
      width: 100%;
      flex: 0 1 auto;
      display: grid;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .media-gallery.count-1 { grid-template-columns: minmax(0, 1fr); }
    .media-gallery.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .media-gallery.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .media-frame {
      width: 100%;
      max-height: min(38dvh, 360px);
      border-radius: 18px;
      overflow: hidden;
      background: #e8e0d4;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .media-gallery.count-2 .media-frame,
    .media-gallery.count-3 .media-frame {
      max-height: min(34dvh, 300px);
    }
    .media-frame img {
      width: 100%;
      height: 100%;
      max-height: inherit;
      object-fit: contain;
      object-position: center;
    }
    .media-frame.is-empty {
      display: none;
    }

    .body {
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
    }
    .page.is-compact .media-frame,
    .page.is-compact .media-gallery.count-2 .media-frame,
    .page.is-compact .media-gallery.count-3 .media-frame {
      max-height: min(28dvh, 260px);
    }
    .page.is-compact .title {
      font-size: clamp(1.2rem, 2.2vw, 1.7rem);
      margin-bottom: 8px;
    }
    .page.is-compact .text {
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      line-height: 1.5;
    }
    .kicker {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #ffe8d2;
      color: var(--accent-deep);
      font-size: 0.8rem;
      font-weight: 800;
    }
    .title {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 2.6vw, 2rem);
      font-weight: 950;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }
    .text {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.05rem, 1.7vw, 1.25rem);
      line-height: 1.65;
      white-space: pre-line;
      word-break: keep-all;
    }
    .materials {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .materials span {
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff4e8;
      border: 1px solid #f0d7b8;
      font-size: 0.92rem;
      font-weight: 700;
    }
    .steps {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      overflow: hidden;
    }
    .steps li {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f7f1e8;
      border: 1px solid var(--line);
      font-size: 0.98rem;
      line-height: 1.45;
      word-break: keep-all;
    }
    .steps .n {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 0.9rem;
    }
    .teacher {
      margin-top: 16px;
      padding: 12px 14px;
      border-left: 4px solid var(--sky);
      background: #eef6fa;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* 영상: 16:9, 화면 안에 맞춤, 스크롤 없음 */
    .video-page {
      width: min(100%, 1080px);
      max-height: 100%;
      padding: clamp(12px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
    }
    .video-page .body { flex: 0 0 auto; }
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: min(58dvh, 560px);
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      border: 1px solid #2a2a2a;
      flex: 0 1 auto;
    }
    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .quiz-box { max-width: 720px; }
    .quiz-options {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .quiz-options button {
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .quiz-options button.is-selected {
      border-color: var(--accent);
      background: #fff4e8;
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .quiz-submit {
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #f0a04b);
      color: #fff;
      font-weight: 900;
    }
    .quiz-result { margin-top: 10px; color: var(--ok); font-weight: 700; }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 6px;
    }
    .nav-btn {
      min-width: 110px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 800;
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent), #f0a04b);
      border: 0;
      color: #fff;
    }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .dots i {
      width: 8px; height: 8px; border-radius: 50%;
      background: #d5cbbb;
    }
    .dots i.on { background: var(--accent); width: 22px; border-radius: 999px; }

    .panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(20,24,30,0.35);
      display: grid;
      place-items: end center;
      padding: 20px;
    }
    .panel-box {
      width: min(520px, 100%);
      max-height: 70%;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
    }
    .panel-box h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .panel-box p { margin: 0; line-height: 1.55; color: var(--muted); white-space: pre-line; }

    @media (max-width: 800px) {
      .tap { width: 12%; }
      .media-gallery.count-2,
      .media-gallery.count-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .media-frame,
      .media-gallery.count-2 .media-frame,
      .media-gallery.count-3 .media-frame { max-height: min(28dvh, 220px); }
      .video-frame { max-height: min(42dvh, 320px); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div>
        <h1 id="lessonTitle">디지털 교안</h1>
        <div class="meta" id="lessonMeta"></div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pagePill">1 / 1</span>
        <button class="ghost" id="teacherBtn" type="button">교사용</button>
        <button class="ghost" id="fsBtn" type="button">전체화면</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <button class="tap prev" id="prevTap" type="button" aria-label="이전"></button>
      <button class="tap next" id="nextTap" type="button" aria-label="다음"></button>
      <div id="pageRoot"></div>
      <div class="panel" id="teacherPanel" hidden>
        <div class="panel-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
            <h2>교사용 안내</h2>
            <button class="ghost" id="closeTeacher" type="button">닫기</button>
          </div>
          <p id="teacherText"></p>
        </div>
      </div>
    </section>

    <footer class="bottom">
      <button class="nav-btn" id="prevBtn" type="button">← 이전</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn primary" id="nextBtn" type="button">다음 →</button>
    </footer>
  </div>

  <script>
    const lessonData = __LESSON_DATA__;
    const state = { index: 0, selectedQuiz: null, doneQuiz: new Set() };

    function pagesFromLesson(data) {
      const pages = [];
      (data.stages || []).forEach((stage) => {
        if (stage.type === "intro") {
          const imgs = (stage.images && stage.images.length)
            ? stage.images
            : (stage.image ? [stage.image] : []);
          pages.push({
            kind: "content",
            kicker: stage.displayName || stage.label,
            title: stage.title || stage.label,
            text: stage.bubble || "",
            image: imgs[0] || "",
            images: imgs,
            materials: stage.materials || [],
            teacherTalk: stage.teacherTalk || "",
          });
          return;
        }
        if (stage.type === "discussion") {
          const list = stage.discussionPages?.length
            ? stage.discussionPages
            : [{ bubble: stage.bubble }];
          list.forEach((p, i) => {
            pages.push({
              kind: "content",
              kicker: stage.displayName || "생각나누기",
              title: `질문 ${i + 1}`,
              text: p.bubble || "",
              image: p.image || stage.image || "",
              teacherTalk: p.teacherTalk || stage.teacherTalk || "",
            });
          });
          return;
        }
        if (stage.type === "video") {
          pages.push({
            kind: "video",
            kicker: stage.displayName || "영상",
            title: stage.title || "인터랙티브 영상",
            text: stage.bubble || "",
            videoUrl: stage.videoUrl || "",
            image: stage.image || "",
            teacherTalk: stage.teacherTalk || "",
          });
          return;
        }
        if (stage.type === "play") {
          const list = stage.playPages?.length ? stage.playPages : [{
            title: stage.title, bubble: stage.bubble, steps: [], image: stage.image
          }];
          if (stage.bubble) {
            pages.push({
              kind: "content",
              kicker: stage.displayName || "활동",
              title: "활동을 시작해요",
              text: stage.bubble,
              image: stage.image || list[0]?.image || "",
              teacherTalk: stage.teacherTalk || "",
            });
          }
          list.forEach((p) => {
            pages.push({
              kind: "activity",
              kicker: stage.displayName || "활동",
              title: p.title || "활동",
              text: p.bubble || "",
              steps: p.steps || [],
              image: p.image || stage.image || "",
              teacherTalk: p.teacherTalk || stage.teacherTalk || "",
            });
          });
          return;
        }
        if (stage.type === "closing") {
          const list = stage.closingPages?.length ? stage.closingPages : [{
            bubble: stage.bubble, title: stage.title, isClosingFinale: true
          }];
          list.forEach((p) => {
            if (p.quiz) {
              pages.push({
                kind: "quiz",
                kicker: p.displayName || "평가하기",
                title: p.title || p.quiz.question,
                text: p.bubble || p.quiz.question,
                image: p.image || stage.image || "",
                quiz: p.quiz,
                teacherTalk: p.teacherTalk || "",
              });
            } else {
              pages.push({
                kind: "content",
                kicker: p.displayName || stage.displayName || "마무리",
                title: p.title || "오늘 정말 잘했어요!",
                text: p.bubble || stage.bubble || "",
                image: p.image || stage.image || "",
                teacherTalk: p.teacherTalk || stage.teacherTalk || "",
                homework: p.homework || stage.homework || "",
              });
            }
          });
        }
      });
      return pages;
    }

    const pages = pagesFromLesson(lessonData);
    const els = {
      title: document.getElementById("lessonTitle"),
      meta: document.getElementById("lessonMeta"),
      pill: document.getElementById("pagePill"),
      root: document.getElementById("pageRoot"),
      dots: document.getElementById("dots"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      prevTap: document.getElementById("prevTap"),
      nextTap: document.getElementById("nextTap"),
      teacherBtn: document.getElementById("teacherBtn"),
      teacherPanel: document.getElementById("teacherPanel"),
      teacherText: document.getElementById("teacherText"),
      closeTeacher: document.getElementById("closeTeacher"),
      fsBtn: document.getElementById("fsBtn"),
    };

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      const page = pages[state.index];
      if (!page) return;
      els.title.textContent = lessonData.title || "디지털 교안";
      els.meta.textContent = lessonData.level || "";
      els.pill.textContent = `${state.index + 1} / ${pages.length}`;
      els.prevBtn.disabled = state.index <= 0;
      els.prevTap.disabled = state.index <= 0;
      els.nextBtn.disabled = state.index >= pages.length - 1;
      els.nextTap.disabled = state.index >= pages.length - 1;
      els.nextBtn.textContent = state.index >= pages.length - 1 ? "완료" : "다음 →";

      els.dots.innerHTML = pages.map((_, i) =>
        `<i class="${i === state.index ? "on" : ""}"></i>`
      ).join("");

      const imgList = (page.images && page.images.length)
        ? page.images.filter(Boolean).slice(0, 3)
        : (page.image ? [page.image] : []);
      const media = imgList.length
        ? `<div class="media-gallery count-${imgList.length}">${
            imgList.map((src, i) =>
              `<div class="media-frame"><img src="${escapeHtml(src)}" alt="${escapeHtml(page.title || page.kicker || "수업 이미지")} ${i + 1}"></div>`
            ).join("")
          }</div>`
        : `<div class="media-frame is-empty" aria-hidden="true"></div>`;

      const isCompact = page.kind === "content"
        && !(page.steps || []).length
        && !(page.materials || []).length
        && String(page.text || "").length < 120;

      if (page.kind === "video") {
        els.root.innerHTML = `
          <div class="page">
            <div class="video-page">
              <div class="body">
                <span class="kicker">${escapeHtml(page.kicker || "영상")}</span>
                <h2 class="title">${escapeHtml(page.title)}</h2>
                <p class="text">${escapeHtml(page.text)}</p>
              </div>
              <div class="video-frame">
                <iframe src="${escapeHtml(page.videoUrl)}" title="수업 영상" allowfullscreen
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
              </div>
            </div>
          </div>`;
        return;
      }

      if (page.kind === "quiz") {
        const key = String(state.index);
        const options = (page.quiz?.options || []).map((opt, i) =>
          `<button type="button" data-i="${i}" class="${state.selectedQuiz === i ? "is-selected" : ""}">${i + 1}. ${escapeHtml(opt)}</button>`
        ).join("");
        els.root.innerHTML = `
          <div class="page">
            <div class="page-stack">
              ${media}
              <div class="body">
                <span class="kicker">${escapeHtml(page.kicker || "평가")}</span>
                <h2 class="title">${escapeHtml(page.quiz?.question || page.title)}</h2>
                <div class="quiz-box">
                  <div class="quiz-options" id="quizOptions">${options}</div>
                  <button class="quiz-submit" id="quizSubmit" type="button">${state.doneQuiz.has(key) ? "다음으로" : "선택 완료"}</button>
                  <p class="quiz-result" id="quizResult">${state.doneQuiz.has(key) ? "응답을 기록했어요." : ""}</p>
                </div>
              </div>
            </div>
          </div>`;
        document.getElementById("quizOptions")?.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-i]");
          if (!btn) return;
          state.selectedQuiz = Number(btn.dataset.i);
          render();
        });
        document.getElementById("quizSubmit")?.addEventListener("click", () => {
          const key = String(state.index);
          if (state.doneQuiz.has(key)) { go(1); return; }
          if (state.selectedQuiz == null) {
            document.getElementById("quizResult").textContent = "보기를 먼저 골라주세요.";
            return;
          }
          state.doneQuiz.add(key);
          document.getElementById("quizResult").textContent = "응답을 기록했어요.";
          document.getElementById("quizSubmit").textContent = "다음으로";
        });
        return;
      }

      const steps = (page.steps || []).map((s, i) =>
        `<li><span class="n">${i + 1}</span><span>${escapeHtml(s)}</span></li>`
      ).join("");
      const mats = (page.materials || []).map((m) => `<span>${escapeHtml(m)}</span>`).join("");
      els.root.innerHTML = `
        <div class="page${isCompact ? " is-compact" : ""}">
          <div class="page-stack">
            ${media}
            <div class="body">
              <span class="kicker">${escapeHtml(page.kicker || "")}</span>
              <h2 class="title">${escapeHtml(page.title)}</h2>
              <p class="text">${escapeHtml(page.text)}</p>
              ${mats ? `<div class="materials">${mats}</div>` : ""}
              ${steps ? `<ol class="steps">${steps}</ol>` : ""}
              ${page.homework ? `<p class="teacher" style="border-color:var(--accent);background:#fff4e8;">가정연계: ${escapeHtml(page.homework)}</p>` : ""}
            </div>
          </div>
        </div>`;
    }

    function go(delta) {
      const next = state.index + delta;
      if (next < 0 || next >= pages.length) return;
      state.index = next;
      state.selectedQuiz = null;
      render();
    }

    els.prevBtn.addEventListener("click", () => go(-1));
    els.nextBtn.addEventListener("click", () => {
      if (state.index >= pages.length - 1) return;
      go(1);
    });
    els.prevTap.addEventListener("click", () => go(-1));
    els.nextTap.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
      if (e.key === "Escape") els.teacherPanel.hidden = true;
    });

    els.teacherBtn.addEventListener("click", () => {
      const page = pages[state.index];
      els.teacherText.textContent = page?.teacherTalk || "이 화면 교사용 안내가 없습니다.";
      els.teacherPanel.hidden = false;
    });
    els.closeTeacher.addEventListener("click", () => { els.teacherPanel.hidden = true; });
    els.teacherPanel.addEventListener("click", (e) => {
      if (e.target === els.teacherPanel) els.teacherPanel.hidden = true;
    });
    els.fsBtn.addEventListener("click", async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    });

    render();
  </script>
</body>
</html>
